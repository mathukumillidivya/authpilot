<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AuthPilot: prior authorization review workspace</title>
<meta name="description" content="A utilization review workspace where AI agents review prior authorization requests against Medicare policy, quote the record for every finding, and leave denials for a clinician to sign.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='3' width='26' height='26' rx='5' fill='%230F2747'/%3E%3Cpath d='M9 16.5l4.5 4.5L23 11' stroke='%23F2E35B' stroke-width='3.2' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&family=Martian+Mono:wdth,wght@75..112.5,300..700&display=swap" rel="stylesheet">
<style>
:root {
  --navy: #0E2142; --navy-2: #13294F; --navy-3: #1E3A66; --navy-4: #2B4F86; --deep: #071426;
  --film: #EAF1FA; --film-2: #B9C9DE; --film-3: #7E93B3;
  --hi: #F2E35B; --hi-ink: #2B2600;
  --bg: #050C19; --panel: #0B172C; --ink: #E8F0FB; --ink-2: #C3D1E6; --muted: #8296B4; --line: #1A2B48; --line-2: #132239; --sunk: #08142A;
  --ok: #4CD39A; --ok-bg: #0E3528; --ok-d: #4CD39A; --no: #FF7A72; --no-bg: #3E1519; --no-d: #FF6F66;
  --ask: #F5B53D; --ask-bg: #3A2B0A; --ask-d: #F5B53D; --na-bg: #182844;
  --violet: #9C82FF; --ai: #7DB4FF; --ai-d: #9DBBFF; --code: #5BE0C6; --code-d: #67D8C3; --cyan: #4FD1FF;
  --sans: "Archivo", system-ui, sans-serif; --mono: "Martian Mono", ui-monospace, monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0 }
[hidden] { display: none !important }
body { font-family: var(--sans); font-size: 15px; line-height: 1.5; color: var(--ink); background: radial-gradient(1100px 600px at 85% -15%, #10306A66, transparent 70%), radial-gradient(900px 500px at -10% 110%, #0B3A4E40, transparent 70%), var(--bg); background-attachment: fixed; -webkit-font-smoothing: antialiased }
::selection { background: #F2E35B; color: #2B2600 }
button, select, input, textarea { font: inherit; color: inherit }
button { cursor: pointer }
a { color: var(--cyan) }
:focus-visible { outline: 3px solid var(--cyan); outline-offset: 2px; border-radius: 4px }
.mono { font-family: var(--mono) }
.num { font-variant-numeric: tabular-nums }

/* ---------- app shell */
.app { display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: 100vh }
.side { background: #040A16; border-right: 1px solid #10203B; color: var(--film); position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; padding: 18px 12px; gap: 22px; z-index: 20 }
.brand { display: flex; align-items: center; gap: 10px; font-stretch: 125%; font-weight: 850; font-size: 19px; color: var(--film); text-decoration: none; padding: 0 8px }
.brand svg { width: 28px; height: 28px; flex: none }
.side nav { display: grid; gap: 2px }
.side nav a { display: flex; align-items: center; gap: 11px; color: var(--film-2); text-decoration: none; padding: 9px 10px; border-radius: 8px; font-size: 14.5px; font-weight: 500 }
.side nav a svg { width: 18px; height: 18px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round }
.side nav a:hover { background: var(--navy-2); color: var(--film) }
.side nav a[aria-current="page"] { background: linear-gradient(90deg, #17325C, #0E2142); color: var(--film); box-shadow: inset 3px 0 var(--hi) }
.side nav a .count { margin-left: auto; font-size: 12px; color: var(--film-3); font-family: var(--mono) }
.side nav a .count.due { color: var(--hi-ink); background: var(--hi); border-radius: 99px; padding: 0 7px; font-weight: 700 }
.side .grp { font-size: 12px; color: var(--film-3); padding: 0 10px; margin-bottom: 4px }
.side .me { margin-top: auto; border-top: 1px solid var(--navy-3); padding: 14px 10px 0; display: grid; gap: 3px; font-size: 13px; color: var(--film-2) }
.side .me b { color: var(--film); font-size: 14px }
.main { min-width: 0; display: flex; flex-direction: column }
.top { position: sticky; top: 0; z-index: 15; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 14px; padding: 10px 28px; min-height: 58px }
.search { flex: 1; max-width: 460px; position: relative }
.search input { width: 100%; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px 8px 34px; font-size: 14px }
.search svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; stroke: var(--muted); fill: none; stroke-width: 2 }
.status { margin-left: auto; display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-2); background: var(--panel); border: 1px solid var(--line); border-radius: 99px; padding: 5px 12px; white-space: nowrap }
.status i { width: 8px; height: 8px; border-radius: 50%; background: var(--film-3) }
.status.on i { background: var(--ok); box-shadow: 0 0 0 3px #17885A30 }
.status.wake i { background: var(--ask-d); animation: blink 1s infinite }
@keyframes blink { 50% { opacity: .3 } }
.demo { font-size: 12.5px; color: var(--muted) }
.view { padding: 26px 28px 60px; display: grid; gap: 22px; align-content: start; max-width: 1480px; width: 100%; grid-template-columns: minmax(0, 1fr) }
.view > *, .panel { min-width: 0 }
@media (max-width: 900px) {
  .app { grid-template-columns: minmax(0, 1fr) }
  .side { position: sticky; height: auto; flex-direction: row; align-items: center; padding: 10px 12px; gap: 12px; overflow-x: auto; scrollbar-width: none }
  .side > div { flex: none } .side nav { display: flex; gap: 2px } .side .grp, .side .me, .side nav a .count { display: none }
  .side nav a { white-space: nowrap; padding: 7px 9px } .side nav a svg { display: none }
  .brand span { display: none }
  .top { position: static; padding: 10px 16px } .demo { display: none } .search { max-width: none }
  .view { padding: 18px 16px 48px }
}

/* ---------- common */
.vhead { display: flex; justify-content: space-between; align-items: end; gap: 12px 24px; flex-wrap: wrap }
.vhead h1 { font-size: clamp(26px, 3vw, 36px); line-height: 1.05; font-stretch: 125%; font-weight: 850; letter-spacing: -.02em }
.vhead p { color: var(--muted); max-width: 74ch; margin-top: 6px }
.crumbs { font-size: 13.5px; color: var(--muted); display: flex; gap: 8px; align-items: center }
.crumbs a { color: var(--muted); text-decoration: none } .crumbs a:hover { color: var(--ink) }
.panel { background: linear-gradient(180deg, #0D1B33, #0A1529); border: 1px solid var(--line); border-radius: 14px }
.panel > header { display: flex; justify-content: space-between; align-items: center; gap: 4px 12px; padding: 14px 18px; border-bottom: 1px solid var(--line-2); flex-wrap: wrap }
.panel > header h2 { font-size: 15.5px; font-weight: 700 }
.panel > header span { font-size: 13px; color: var(--muted) }
.pad { padding: 16px 18px }
.btn { border: 0; border-radius: 9px; padding: 9px 15px; font-weight: 700; font-size: 14px; background: var(--navy-3); color: var(--film); display: inline-flex; gap: 8px; align-items: center; white-space: nowrap }
.btn:hover { background: var(--navy-4) }
.btn.hl { background: var(--hi); color: var(--hi-ink); box-shadow: 0 0 0 1px #F2E35B, 0 8px 28px -8px #F2E35B99 } .btn.hl:hover { filter: brightness(1.04) }
.btn.line { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1px #2B4470 } .btn.line:hover { box-shadow: inset 0 0 0 1px var(--cyan) }
.btn.danger { background: #D63A3A; color: #fff } .btn.good { background: #17885A; color: #fff }
.btn:disabled { opacity: .45; cursor: default }
.btn svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 700; border-radius: 6px; padding: 2px 8px; white-space: nowrap }
.chip.APPROVE, .chip.met { background: var(--ok-bg); color: var(--ok) }
.chip.DENY, .chip.not_met { background: var(--no-bg); color: var(--no) }
.chip.NEED_INFO, .chip.missing { background: var(--ask-bg); color: var(--ask) }
.chip.not_applicable, .chip.plain { background: var(--na-bg); color: var(--ink-2) }
.chip.signed { background: var(--navy); color: var(--film) }
.chip.due { background: var(--hi); color: var(--hi-ink) }
.tag { font-size: 11.5px; font-weight: 700; border-radius: 4px; padding: 1px 6px; white-space: nowrap }
.tag.ai { color: var(--ai); box-shadow: inset 0 0 0 1px #2F6FED55 } .tag.code { color: var(--code); box-shadow: inset 0 0 0 1px #0E8C7855 }
.kpis { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)) }
.kpi { background: linear-gradient(180deg, #0D1B33, #0A1529); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: grid; gap: 2px; text-align: left; align-content: start }
button.kpi:hover { border-color: var(--muted) }
.kpi b { font-stretch: 112%; font-weight: 800; font-size: 28px; line-height: 1.15; font-variant-numeric: tabular-nums }
.kpi span { font-size: 13px; color: var(--muted) }
.kpi.due { background: linear-gradient(135deg, #2E2A08, #0B172C 70%); border-color: #F2E35B66; color: var(--film); box-shadow: 0 0 30px -12px #F2E35B66 } .kpi.due span { color: var(--film-2) } .kpi.due b { color: var(--hi) }
.tw { overflow-x: auto }
table { border-collapse: collapse; width: 100%; font-size: 14px }
th, td { text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--line-2); vertical-align: middle }
th { font-size: 12.5px; color: var(--muted); font-weight: 600; background: var(--sunk); white-space: nowrap }
th button { border: 0; background: none; font-weight: 600; color: inherit; padding: 0 }
td.r, th.r { text-align: right }
tbody tr.go { cursor: pointer } tbody tr.go:hover { background: #0F2140 }
tr.ours td { font-weight: 700 }
.sub { display: block; font-size: 12px; color: var(--muted) }
.idc { display: block; font-family: var(--mono); font-size: 11.5px; color: var(--muted) }
.ok-t { color: var(--ok); font-weight: 700; white-space: nowrap } .no-t { color: var(--no); font-weight: 700; white-space: nowrap }
.tip { position: fixed; z-index: 60; pointer-events: none; max-width: 340px; background: #112546; border: 1px solid #2B4470; color: var(--film); border-radius: 8px; padding: 9px 11px; font-size: 12.5px; line-height: 1.5; box-shadow: 0 10px 30px -10px #000a; opacity: 0; transition: opacity .12s }
.tip.on { opacity: 1 } .tip .mono { font-size: 11.5px; color: var(--film-2) }
.empty { color: var(--muted); padding: 28px 18px; text-align: center }
.note { font-size: 12.5px; color: var(--muted) }

/* ---------- queue */
.featured { display: grid; gap: 12px; grid-template-columns: repeat(3, minmax(0, 1fr)) }
@media (max-width: 1100px) { .featured { grid-template-columns: repeat(2, minmax(0, 1fr)) } } @media (max-width: 640px) { .featured { grid-template-columns: minmax(0, 1fr) } }
.feat { background: linear-gradient(160deg, #102650, #0A1529 70%); color: var(--film); border-radius: 12px; padding: 15px 16px; display: grid; gap: 7px; text-decoration: none; align-content: start; border: 1px solid #1E3A66 }
.feat:hover { border-color: var(--cyan); box-shadow: 0 0 30px -10px #4FD1FF88 }
.feat .k { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--film-3); align-items: center }
.feat .k .chip { font-family: var(--sans) }
.feat b { font-size: 15.5px } .feat p { font-size: 13.5px; color: var(--film-2) }
.toolbar { display: flex; gap: 10px 14px; flex-wrap: wrap; align-items: center; padding: 12px 14px; border-bottom: 1px solid var(--line-2) }
.seg { display: inline-flex; background: var(--sunk); border: 1px solid var(--line); border-radius: 8px; padding: 3px; gap: 2px; overflow-x: auto; max-width: 100% }
.seg button { border: 0; background: none; padding: 5px 11px; border-radius: 6px; font-size: 13.5px; font-weight: 600; color: var(--muted); white-space: nowrap }
.seg button[aria-pressed="true"] { background: #1A2F55; color: var(--ink); box-shadow: 0 1px 2px #0F274722 }
.seg button em { font-style: normal; font-weight: 500; color: var(--muted); margin-left: 5px; font-size: 12.5px }
.toolbar select, .toolbar input { border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; background: var(--panel); font-size: 13.5px }
.pager { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 14px; font-size: 13px; color: var(--muted) }
.pager div { display: flex; gap: 6px }

/* ---------- case */
.casehead { display: flex; justify-content: space-between; gap: 16px 24px; flex-wrap: wrap; align-items: end }
.casehead h1 { font-size: clamp(26px, 3.2vw, 38px); font-stretch: 125%; font-weight: 850; letter-spacing: -.02em; line-height: 1.05 }
.casehead .meta { display: flex; gap: 8px 14px; flex-wrap: wrap; color: var(--muted); font-size: 14px; margin-top: 8px; align-items: center }
.casehead .acts { display: flex; gap: 8px; flex-wrap: wrap }
.stepper { list-style: none; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)) }
@media (max-width: 1100px) { .stepper { grid-template-columns: repeat(4, minmax(0, 1fr)) } }
@media (max-width: 640px) { .stepper { grid-template-columns: repeat(2, minmax(0, 1fr)) } }
.stepper li { padding: 11px 13px 13px; border-right: 1px solid var(--line-2); display: grid; gap: 3px; align-content: start; position: relative; min-width: 0 }
.stepper li::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: var(--line-2) }
.stepper li.running::after { background: var(--hi); animation: blink 1s infinite } .stepper li.done::after { background: var(--navy) }
.stepper li.skipped { opacity: .5 }
.stepper .h { display: flex; gap: 6px; align-items: center; justify-content: space-between }
.stepper b { font-size: 13.5px }
.stepper p { font-size: 12px; color: var(--muted); overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical }
.runbar { display: flex; justify-content: space-between; gap: 12px 24px; flex-wrap: wrap; align-items: center; border-top: 1px solid var(--line-2); padding: 12px 18px }
.meters { display: flex; gap: 22px; align-items: baseline; flex-wrap: wrap }
.meter { display: grid } .meter b { font-family: var(--mono); font-weight: 500; font-size: 19px; line-height: 1.2 } .meter span { font-size: 12px; color: var(--muted) }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none }
.tabs button { border: 0; background: none; padding: 10px 14px; font-weight: 600; font-size: 14px; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink) }
.decide { display: grid; grid-template-columns: auto minmax(0, 1fr) minmax(0, 1.25fr); align-items: stretch }
@media (max-width: 1000px) { .decide { grid-template-columns: minmax(0, 1fr) } .decide .sec { border-left: 0 !important; border-top: 1px solid var(--line-2) } }
.decide .stampbox { padding: 18px 26px 16px 22px; display: grid; place-items: center start }
.stamp { font-stretch: 125%; font-weight: 900; font-size: 32px; line-height: 1; padding: 10px 16px 8px; border: 4px solid currentColor; border-radius: 9px; transform: rotate(-5deg); display: grid; gap: 3px; text-shadow: 0 0 18px currentColor; box-shadow: 0 0 24px -6px currentColor, inset 0 0 18px -8px currentColor }
.stamp small { font-size: 12px; font-weight: 700; font-stretch: 100% }
.stamp.APPROVE { color: var(--ok) } .stamp.DENY { color: var(--no) } .stamp.NEED_INFO { color: var(--ask) } .stamp.none { color: #5F7395; border-style: dashed; text-shadow: none; box-shadow: none }
.stamp.slam { animation: slam .45s cubic-bezier(.2, 1.5, .4, 1) }
@keyframes slam { from { transform: rotate(-14deg) scale(2); opacity: 0 } 60% { opacity: 1 } to { transform: rotate(-5deg) scale(1) } }
.decide .sec { padding: 14px 18px; border-left: 1px solid var(--line-2); display: grid; gap: 8px; align-content: start }
.decide h3 { font-size: 13px; color: var(--muted); font-weight: 600 }
.rl { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 10px; font-size: 13.5px; align-items: center }
.decide textarea { width: 100%; min-height: 42px; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 13.5px; resize: vertical }
.decide .row { display: flex; gap: 8px; flex-wrap: wrap }
.signed { background: var(--sunk); border-radius: 8px; padding: 10px 12px; font-size: 13.5px; display: grid; gap: 2px }

/* evidence viewer (dark) */
.viewer { background: linear-gradient(180deg, #0C1D3B, #08152B); border: 1px solid var(--line); color: var(--film); border-radius: 14px; padding: 18px; display: grid; gap: 14px; position: relative }
.viewer .evhead { display: flex; justify-content: space-between; gap: 8px 20px; flex-wrap: wrap; align-items: end }
.viewer h2 { font-size: 16.5px; font-weight: 700 }
.legend { display: flex; gap: 6px 16px; flex-wrap: wrap; font-size: 12.5px; color: var(--film-2) }
.legend span { display: inline-flex; align-items: center; gap: 7px }
.legend i { width: 10px; height: 10px; border-radius: 50%; background: var(--film-3); display: inline-block }
.legend i.q { background: var(--hi); box-shadow: 0 0 0 3px #F2E35B40 }
.legend i.band { border-radius: 2px; width: 18px; background: #F2E35B26; box-shadow: inset 0 0 0 1px #F2E35B70 }
.map { background: var(--deep); border: 1px solid var(--navy-3); border-radius: 10px; padding: 10px 14px 6px; overflow-x: auto; position: relative; z-index: 1 }
.map .grid { display: grid; grid-template-columns: 112px minmax(0, 1fr); min-width: 620px }
.map .grid > div:nth-child(odd) { position: sticky; left: -14px; z-index: 5; background: var(--deep); padding-left: 14px; margin-left: -14px }
.map .lab { font-size: 12px; color: var(--film-3); height: 28px; display: flex; align-items: center }
.map .track { position: relative; border-left: 1px solid var(--navy-3) }
.map .lane { height: 28px; border-bottom: 1px dashed #234A7E80 }
.map .axis { position: relative; height: 20px; font-family: var(--mono); font-size: 10px; color: var(--film-3) }
.map .axis span { position: absolute; transform: translateX(-50%); top: 3px; white-space: nowrap } .map .axis span.end { transform: translateX(-100%) }
.map .vt { position: absolute; top: 0; bottom: 0; width: 1px; background: #234A7E }
.map .orderline { position: absolute; top: 0; bottom: 0; right: 0; width: 2px; background: var(--hi) }
.map .win { position: absolute; top: 0; bottom: 0; right: 0; background: #F2E35B14; border-left: 1.5px dashed #F2E35B90 }
.map .win em { position: absolute; top: 3px; left: 6px; font-style: normal; font-size: 10.5px; color: var(--hi); white-space: nowrap }
.map .atleast { position: absolute; top: 0; bottom: 0; border-left: 1.5px dashed #9DBBFFAA }
.map .atleast em { position: absolute; bottom: 3px; right: 6px; font-style: normal; font-size: 10.5px; color: var(--ai-d); white-space: nowrap }
.dot { position: absolute; width: 10px; height: 10px; margin: -5px 0 0 -5px; border-radius: 50%; border: 0; padding: 0; background: var(--film-3); opacity: .7; transition: transform .2s, background .2s }
.dot:hover, .dot:focus-visible { opacity: 1; transform: scale(1.4) }
.dot.hit { opacity: 1; background: var(--hi); box-shadow: 0 0 0 4px #F2E35B40; z-index: 2 }
.dot.hit.not_met { box-shadow: 0 0 0 4px #FF6F6666 }
.dot.ping { animation: ping .9s 2 } @keyframes ping { 50% { transform: scale(2.2) } }
.threads { position: absolute; inset: 0; pointer-events: none; overflow: visible; z-index: 3 }
.threads path { fill: none; stroke-width: 1.6; opacity: .85 }
.threads path.pending { stroke-dasharray: 4 4; opacity: .55 }
.threads path.draw { stroke-dasharray: var(--len); stroke-dashoffset: var(--len); animation: draw .7s ease-out forwards } @keyframes draw { to { stroke-dashoffset: 0 } }
.rules { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); position: relative; z-index: 4; margin-top: 30px }
@media (max-width: 900px) { .rules { margin-top: 4px } .threads { display: none } }
.rule { background: var(--navy-2); border: 1px solid var(--navy-3); border-top: 3px solid var(--navy-4); border-radius: 4px 4px 10px 10px; padding: 13px 14px; display: grid; gap: 8px; align-content: start }
.rule.met { border-top-color: var(--ok-d) } .rule.not_met { border-top-color: var(--no-d) } .rule.missing { border-top-color: var(--ask-d) } .rule.not_applicable { border-top-color: var(--film-3) }
.rule h3 { font-size: 15px; font-weight: 700; line-height: 1.3 }
.rule .rt { font-size: 12px; color: var(--film-3); line-height: 1.5 }
.rule .why { font-size: 13px; color: var(--film-2) }
.st { display: inline-flex; gap: 6px; align-items: center; font-size: 12px; font-weight: 700; width: fit-content; border-radius: 99px; padding: 2px 10px 2px 6px; background: var(--navy-3); color: var(--film-2) }
.st i { font-style: normal; width: 16px; height: 16px; border-radius: 50%; display: grid; place-items: center; font-size: 10.5px; background: var(--navy-4); color: var(--film) }
.st.met { color: var(--ok-d) } .st.met i { background: var(--ok-d); color: var(--navy) }
.st.not_met { color: var(--no-d) } .st.not_met i { background: var(--no-d); color: var(--navy) }
.st.missing { color: var(--ask-d) } .st.missing i { background: var(--ask-d); color: var(--navy) }
.st.working i { animation: spin 1s linear infinite; background: transparent; border: 2px solid var(--hi); border-right-color: transparent } @keyframes spin { to { transform: rotate(360deg) } }
.quote { text-align: left; background: var(--deep); border: 0; border-left: 3px solid var(--hi); border-radius: 0 6px 6px 0; padding: 7px 10px; font-family: var(--mono); font-size: 11px; line-height: 1.6; color: var(--film) }
.quote:hover { background: #0E2647 }
.quote .v { display: block; font-family: var(--sans); font-size: 11.5px; font-weight: 700; margin-bottom: 2px; color: var(--film-3) }
.quote .v.ok { color: var(--ok-d) } .quote .v.no { color: var(--no-d) }
.quote.bad { border-left-color: var(--no-d); opacity: .7; text-decoration: line-through }
.flags { display: grid; gap: 6px }
.flag { font-size: 13px; color: var(--ask-d); background: #F5B53D14; border-left: 3px solid var(--ask-d); padding: 7px 10px; border-radius: 0 6px 6px 0 }

/* trace */
.gantt { display: grid; grid-template-columns: 230px minmax(0, 1fr); font-size: 13px }
@media (max-width: 640px) { .gantt { grid-template-columns: 130px minmax(0, 1fr) } }
.gantt .gl { padding: 6px 8px 6px 0; border-bottom: 1px solid var(--line-2); display: flex; align-items: center; gap: 6px; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.gantt .gt { position: relative; border-bottom: 1px solid var(--line-2); border-left: 1px solid var(--line); height: 32px }
.gantt .bar { position: absolute; top: 7px; height: 18px; border-radius: 4px; min-width: 3px; background: var(--ai); display: flex; align-items: center; padding: 0 6px; font-size: 11px; color: #fff; font-family: var(--mono); white-space: nowrap }
.gantt .bar.code { background: var(--code) }
.gantt .bar.out { color: var(--ink-2); padding: 0 } .gantt .bar.out span { position: absolute; left: calc(100% + 6px) }
.gantt .bar.out.end span { left: auto; right: calc(100% + 6px) }
.gantt .ax { position: relative; height: 22px; font-family: var(--mono); font-size: 10.5px; color: var(--muted) }
.gantt .ax span { position: absolute; transform: translateX(-50%); top: 4px } .gantt .ax span:last-child { transform: translateX(-100%) }
.gantt .grid-l { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--line-2) }
.events { list-style: none; font-family: var(--mono); font-size: 11.5px; line-height: 1.7; max-height: 360px; overflow: auto; display: grid }
.events li { display: grid; grid-template-columns: 62px 96px minmax(0, 1fr); gap: 8px; padding: 4px 0; border-bottom: 1px dashed var(--line-2) }
.events li em { font-style: normal; color: var(--muted) }
@media (max-width: 640px) { .events li { grid-template-columns: 56px minmax(0, 1fr) } .events li span { grid-column: 1 / -1 } }
.letter { padding: 30px 34px; font-size: 14.5px; line-height: 1.65; white-space: pre-wrap; background: #F4F7FB; color: #0F2747 }
.letter .note { color: #5A6B85 } .letter .btn.line { color: #0F2747; box-shadow: inset 0 0 0 1px #C9D4E2 }
.lhead { display: flex; justify-content: space-between; gap: 10px; align-items: start; border-bottom: 2px solid #0F2747; padding-bottom: 12px; margin-bottom: 16px; white-space: normal }
.lhead b { font-stretch: 125%; font-weight: 850; font-size: 18px }
.fax { padding: 20px 22px; font-family: var(--mono); font-size: 12.5px; line-height: 1.65 }
.fax dl { display: grid; grid-template-columns: 9em minmax(0, 1fr); gap: 3px 12px } .fax dt { color: var(--muted) }
.fax .claim { margin-top: 14px; border: 1.5px dashed #9DAABD; border-radius: 4px; padding: 10px 12px; display: grid; gap: 4px }
.fax .claim small { font-family: var(--sans); font-size: 12px; color: var(--muted); font-weight: 600 }
@media (max-width: 640px) { .fax dl { grid-template-columns: 6.6em minmax(0, 1fr) } .letter { padding: 20px } }
.reclist { list-style: none; font-family: var(--mono); font-size: 11.5px; line-height: 1.6; max-height: 520px; overflow: auto }
.reclist li { padding: 7px 18px; border-bottom: 1px solid var(--line-2) }
.reclist li.hit { background: #F2E35B14; box-shadow: inset 3px 0 var(--hi); color: var(--film) }
.audit { list-style: none; display: grid; padding: 4px 18px 12px }
.audit li { display: grid; grid-template-columns: 14px minmax(0, 1fr) auto; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line-2); font-size: 14px; align-items: start }
.audit li:last-child { border-bottom: 0 }
.audit li i { width: 10px; height: 10px; border-radius: 50%; background: var(--line); margin-top: 6px } .audit li.ai i { background: var(--ai) } .audit li.code i { background: var(--code) } .audit li.human i { background: var(--hi); box-shadow: 0 0 0 2px var(--ink) }
.audit li em { font-style: normal; font-family: var(--mono); font-size: 11.5px; color: var(--muted); white-space: nowrap }
.audit li span { color: var(--muted); font-size: 13px; display: block }

/* runs */
.hist svg { width: 100%; height: auto; display: block; overflow: visible }
.charts2 { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)) }
@media (max-width: 400px) { .charts2 { grid-template-columns: minmax(0, 1fr) } }

/* policies */
.pols { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(360px, 1fr)) }
@media (max-width: 460px) { .pols { grid-template-columns: minmax(0, 1fr) } }
.pol { display: grid; align-content: start }
.pol .ph { padding: 16px 18px; border-bottom: 1px solid var(--line-2); display: grid; gap: 6px }
.pol .ph h2 { font-size: 17px; line-height: 1.3 }
.pol .ph .src { font-size: 13px; color: var(--muted) }
.pol ol { list-style: none; display: grid }
.pol li { padding: 12px 18px; border-bottom: 1px solid var(--line-2); display: grid; gap: 5px }
.pol li b { font-size: 14px } .pol li p { font-size: 13px; color: var(--ink-2) }
.pol .badges { display: flex; gap: 6px; flex-wrap: wrap }
.pol .foot { padding: 12px 18px; display: flex; gap: 6px 16px; flex-wrap: wrap; font-size: 13px; color: var(--muted) }
.pol .foot b { color: var(--ink) }

/* evaluation */
.lead { font-size: 16px; color: var(--ink-2); max-width: 78ch } .lead b { color: var(--ink) }
.callouts { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)) }
.callout { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: grid; gap: 2px; align-content: start }
.callout b { font-stretch: 112%; font-weight: 800; font-size: 26px; line-height: 1.15 } .callout span { font-size: 13px; color: var(--muted) }
.waffles { display: grid; gap: 16px; grid-template-columns: repeat(3, minmax(0, 1fr)) }
@media (max-width: 1240px) { .waffles { grid-template-columns: minmax(0, 1fr) } }
.wf { padding: 18px; display: grid; gap: 12px; align-content: start }
.wf.ours { box-shadow: 0 0 0 1.5px var(--cyan), 0 0 40px -14px #4FD1FF88 }
.wf h3 { font-size: 15px } .wf .pct { font-stretch: 125%; font-weight: 850; font-size: 40px; line-height: 1; letter-spacing: -.02em }
.wf .pct small { font-size: 14px; font-weight: 500; font-stretch: 100%; color: var(--muted); letter-spacing: 0; margin-left: 8px }
.cells { display: grid; grid-template-columns: 74px minmax(0, 1fr); gap: 6px 8px; align-items: center }
.cells .pl { font-size: 11.5px; line-height: 1.25; color: var(--muted) }
.cells .sq { display: grid; grid-template-columns: repeat(20, minmax(0, 1fr)); gap: 2px }
.cell { aspect-ratio: 1; border-radius: 2px; background: #22365A; border: 0; padding: 0; min-width: 0 }
.cell.wd { background: var(--no) } .cell.wa { background: var(--violet) } .cell.ot { background: repeating-linear-gradient(135deg, #8296B4 0 2px, #0B172C 2px 4px) }
.cell.lit { outline: 2px solid var(--cyan); outline-offset: 1px; position: relative; z-index: 1 }
.wf ul { list-style: none; display: grid; gap: 4px; font-size: 13px }
.wf li { display: grid; grid-template-columns: 14px minmax(0, 1fr) auto; gap: 8px; align-items: center }
.wf li i { width: 12px; height: 12px; border-radius: 2px; display: block }
.journey { display: grid; gap: 16px; grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); align-items: start }
@media (max-width: 1000px) { .journey { grid-template-columns: minmax(0, 1fr) } }
.chart svg { width: 100%; height: auto; display: block; overflow: visible }
.steps { list-style: none; counter-reset: s; display: grid; gap: 12px }
.steps li { counter-increment: s; display: grid; grid-template-columns: 32px minmax(0, 1fr); gap: 2px 12px }
.steps li::before { content: counter(s); grid-row: span 2; width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--cyan); color: var(--cyan); display: grid; place-items: center; font-weight: 800; font-size: 13px }
.steps b { font-size: 14.5px } .steps span { font-size: 13.5px; color: var(--muted) }
.limits { list-style: none; display: grid }
.limits li { display: grid; grid-template-columns: minmax(0, 4fr) minmax(0, 8fr); gap: 6px 24px; padding: 14px 18px; border-bottom: 1px solid var(--line-2) }
.limits li:last-child { border-bottom: 0 }
@media (max-width: 760px) { .limits li { grid-template-columns: minmax(0, 1fr) } }
.limits span { color: var(--muted) }

/* simulator */
.sim { display: grid; gap: 16px; grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); align-items: start }
@media (max-width: 1000px) { .sim { grid-template-columns: minmax(0, 1fr) } }
.form { display: grid; gap: 16px }
.form label { display: grid; gap: 5px; font-size: 13px; color: var(--muted); font-weight: 600; align-content: start }
.form select { border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; background: var(--panel); font-size: 14px; color: var(--ink); font-weight: 500; width: 100% }
.form .two { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)) }
.form .checks { display: grid; gap: 8px }
.form .checks label { display: flex; gap: 10px; align-items: center; font-weight: 500; color: var(--ink); font-size: 14px }
.form .rt { font-size: 12px; color: var(--muted); font-weight: 400; line-height: 1.45 }

/* system */
.flowsvg { background: linear-gradient(180deg, #0C1D3B, #08152B); border: 1px solid var(--line); border-radius: 14px; padding: 22px 16px; color: var(--film) }
.flowsvg svg { width: 100%; height: auto; display: block }
.flowlist { display: none; list-style: none; gap: 10px }
@media (max-width: 760px) { .flowsvg svg { display: none } .flowlist { display: grid } }
.flowlist li { display: grid; gap: 2px; border-left: 3px solid var(--ai-d); padding-left: 12px } .flowlist li.code { border-left-color: var(--code-d) }
.flowlist span { font-size: 13px; color: var(--film-2) }
.stack { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)) }
.stack .panel { padding: 16px 18px; display: grid; gap: 6px; align-content: start }
.stack h3 { font-size: 15.5px } .stack p { font-size: 13.5px; color: var(--muted) }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important } }
@media print { .side, .top, .tabs, .casehead .acts, .crumbs, .decide, #runpanel { display: none !important } .app { display: block } body { background: #fff } .panel { border: 0 } }
/* ---------- mission control */
.mc { border: 1px solid #1E3560; border-radius: 16px; overflow: hidden; background: radial-gradient(900px 380px at 35% -10%, #12336A88, transparent 70%), linear-gradient(180deg, #08162D, #050F20); box-shadow: 0 30px 80px -40px #4FD1FF55 }
.mc-head { display: flex; gap: 10px 22px; align-items: center; flex-wrap: wrap; padding: 12px 18px; border-bottom: 1px solid #16294A }
.mode { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; color: var(--film-2); padding: 4px 11px; border-radius: 99px; background: #0E2142; box-shadow: inset 0 0 0 1px #24406E }
.mode i { width: 8px; height: 8px; border-radius: 50%; background: var(--film-3) }
.mode.live { color: #FF8E86; box-shadow: inset 0 0 0 1px #FF6F6688 } .mode.live i { background: #FF6F66; animation: blink .9s infinite; box-shadow: 0 0 10px #FF6F66 }
.mode.replay { color: var(--cyan); box-shadow: inset 0 0 0 1px #4FD1FF66 } .mode.replay i { background: var(--cyan); animation: blink .9s infinite }
.mc-head .runnote { font-size: 13.5px; color: var(--film-2); margin-right: auto }
.mc .meters .meter b { color: var(--film); text-shadow: 0 0 14px #4FD1FF55 }
.mc-body { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); min-height: 470px }
@media (max-width: 1100px) { .mc-body { grid-template-columns: minmax(0, 1fr) } .chat { border-left: 0 !important; border-top: 1px solid #16294A; max-height: 460px !important } }
.netbox { position: relative; padding: 10px 6px 4px }
.netbox svg { width: 100%; height: auto; display: block; overflow: visible }
.edge { fill: none; stroke: #1B3156; stroke-width: 1.6; transition: stroke .3s }
.edge.on { stroke: #2F6FED; stroke-width: 2 }
.edge.loop { stroke-dasharray: 5 5; stroke: #F5B53D; opacity: 0; transition: opacity .3s } .edge.loop.on { opacity: 1 }
.part { fill: #8FE6FF } .part.amber { fill: #FFD27A } .part.red { fill: #FF8E86 }
.nd .core { fill: #0B1A33; stroke: #2B4470; stroke-width: 1.5; transition: fill .3s, stroke .3s }
.nd .ico { fill: none; stroke: #6E84A6; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; transition: stroke .3s }
.nd .lab { fill: #C3D1E6; font-size: 13px; font-weight: 600; font-family: var(--sans) }
.nd .role { fill: #5F7395; font-size: 10.5px; font-family: var(--sans) }
.nd .halo { fill: none; stroke: var(--cyan); stroke-width: 2; opacity: 0; transform-box: fill-box; transform-origin: center }
.nd.active .core { stroke: var(--cyan); fill: #0F2850 } .nd.active .ico { stroke: #BFF0FF }
.nd.active .halo { animation: halo 1.3s ease-out infinite }
@keyframes halo { 0% { opacity: .9; transform: scale(.8) } 100% { opacity: 0; transform: scale(1.7) } }
.nd.done .core { stroke: #4FD1FF88; fill: #0F2347 } .nd.done .ico { stroke: #E8F0FB }
.nd.met .core { stroke: #4CD39A; fill: #0E3528 } .nd.met .ico { stroke: #4CD39A }
.nd.not_met .core { stroke: #FF6F66; fill: #3E1519 } .nd.not_met .ico { stroke: #FF8E86 }
.nd.missing .core { stroke: #F5B53D; fill: #3A2B0A } .nd.missing .ico { stroke: #F5B53D }
.nd.not_applicable .core { stroke: #5F7395; fill: #13213B } .nd.not_applicable .ico { stroke: #8296B4 }
.nd.skipped { opacity: .3 }
.nd.vd.APPROVE .core { fill: #0E3528; stroke: #4CD39A } .nd.vd.DENY .core { fill: #3E1519; stroke: #FF6F66 } .nd.vd.NEED_INFO .core { fill: #3A2B0A; stroke: #F5B53D }
.nd.vd.APPROVE .ico { stroke: #4CD39A } .nd.vd.DENY .ico { stroke: #FF8E86 } .nd.vd.NEED_INFO .ico { stroke: #F5B53D }
.nd.vd .lab { font-weight: 800 }
.nd .glow { filter: drop-shadow(0 0 8px #4FD1FF) }
.chat { border-left: 1px solid #16294A; display: flex; flex-direction: column; max-height: 540px; min-width: 0; background: #06112366 }
.chat-h { display: flex; justify-content: space-between; gap: 10px; align-items: center; padding: 11px 16px; border-bottom: 1px solid #16294A; font-size: 13px; color: var(--film-2) }
.chat-h b { font-family: var(--mono); font-size: 12.5px; color: var(--film) }
.thread { list-style: none; overflow-y: auto; flex: 1; padding: 14px 14px 6px; display: grid; gap: 12px; align-content: start; scroll-behavior: smooth }
.msg { display: grid; grid-template-columns: 32px minmax(0, 1fr); gap: 10px }
.msg.new { animation: pop .35s cubic-bezier(.2, 1.3, .4, 1) }
@keyframes pop { from { opacity: 0; transform: translateY(8px) scale(.98) } }
.av { width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; background: #0E2142; box-shadow: inset 0 0 0 1.5px #2B4470 }
.av svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round }
.av.ai { color: var(--ai-d); box-shadow: inset 0 0 0 1.5px #7DB4FF77 } .av.code { color: var(--code); box-shadow: inset 0 0 0 1.5px #5BE0C677 }
.av.met { color: #4CD39A; box-shadow: inset 0 0 0 1.5px #4CD39A } .av.not_met { color: #FF8E86; box-shadow: inset 0 0 0 1.5px #FF6F66 } .av.missing { color: #F5B53D; box-shadow: inset 0 0 0 1.5px #F5B53D } .av.not_applicable { color: #8296B4 }
.av.vd { background: var(--hi); color: var(--hi-ink); box-shadow: 0 0 18px -4px #F2E35B }
.msg .who { font-size: 13px; font-weight: 700; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap }
.msg .who em { font-style: normal; font-weight: 500; font-size: 11.5px; color: var(--film-3) }
.msg .who time { margin-left: auto; font-family: var(--mono); font-size: 10.5px; color: #5F7395 }
.msg .tx { font-size: 13.5px; color: var(--ink-2); line-height: 1.5 }
.msg .tx b { color: var(--film) }
.msg .tx .at { color: var(--ask); font-weight: 700 }
.msg .qs { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px }
.msg .qchip { font-family: var(--mono); font-size: 10.5px; padding: 2px 7px; border-radius: 5px; background: #F2E35B1A; color: var(--hi); border: 0 }
.msg .tools { font-family: var(--mono); font-size: 10.5px; color: var(--film-3); margin-top: 5px; line-height: 1.7 }
.msg.vdm .tx { font-size: 14px }
.msg.vdm .bubble { background: linear-gradient(135deg, #2E2A0866, transparent); border: 1px solid #F2E35B44; border-radius: 10px; padding: 9px 11px }
.typing { padding: 8px 16px 12px; font-size: 12.5px; color: var(--film-3); min-height: 34px; display: flex; gap: 8px; align-items: center }
.typing i { display: inline-flex; gap: 3px } .typing i b { width: 5px; height: 5px; border-radius: 50%; background: var(--cyan); animation: bounce 1s infinite }
.typing i b:nth-child(2) { animation-delay: .15s } .typing i b:nth-child(3) { animation-delay: .3s }
@keyframes bounce { 50% { transform: translateY(-4px); opacity: .4 } }

/* ---------- landing (scroll story) */
body.home .side, body.home .top { display: none }
body.home .app { grid-template-columns: minmax(0, 1fr) }
body.home .view { max-width: none; padding: 0; gap: 0 }
.lp { color: var(--film) }
.lp-nav { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 12px 26px; padding: 14px clamp(16px, 4vw, 48px); background: color-mix(in srgb, #050C19 80%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid #10203B; flex-wrap: wrap }
.lp-nav .links { display: flex; gap: 4px 18px; margin-right: auto; flex-wrap: wrap }
body.home .brand span { display: inline !important }
@media (max-width: 700px) { .lp-nav .links { display: none } .lp-nav { justify-content: space-between } }
.lp-nav .links a { color: var(--film-2); text-decoration: none; font-size: 14.5px } .lp-nav .links a:hover { color: var(--film) }
.lp-wrap { max-width: 1260px; margin: 0 auto; padding: 0 clamp(16px, 4vw, 48px) }
.hero { display: grid; grid-template-columns: minmax(0, .92fr) minmax(0, 1.08fr); gap: 36px; align-items: center; padding: clamp(40px, 7vw, 90px) 0 50px }
@media (max-width: 1000px) { .hero { grid-template-columns: minmax(0, 1fr) } }
.hero h1 { font-size: clamp(38px, 4.9vw, 72px); line-height: .96; font-stretch: 125%; font-weight: 900; letter-spacing: -.03em }
.hero h1 .l2 { display: block; background: linear-gradient(90deg, #4FD1FF, #9DBBFF 45%, #F2E35B); -webkit-background-clip: text; background-clip: text; color: transparent }
.hero p { font-size: 18px; color: var(--film-2); max-width: 54ch; margin: 22px 0 28px }
.hero .ctas { display: flex; gap: 12px; flex-wrap: wrap }
.hero .ctas .btn { font-size: 15.5px; padding: 13px 20px }
.hero-vis { border: 1px solid #1E3560; border-radius: 18px; background: radial-gradient(600px 300px at 40% 0%, #12336A99, transparent 70%), #061126; padding: 12px; box-shadow: 0 40px 120px -40px #4FD1FF66; position: relative }
.hero-vis .bar { display: flex; gap: 8px; align-items: center; padding: 4px 6px 10px; font-size: 12.5px; color: var(--film-3) }
.hero-vis .bar .mode { margin-right: auto }
.hero-vis .stampover { position: absolute; right: 7%; bottom: 14%; opacity: 0; transform: rotate(-8deg) scale(2) }
.hero-vis .stampover.on { animation: slam2 .5s cubic-bezier(.2, 1.5, .4, 1) forwards }
@keyframes slam2 { 60% { opacity: 1 } to { opacity: 1; transform: rotate(-8deg) scale(1) } }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0; border-top: 1px solid #16294A; border-bottom: 1px solid #16294A }
@media (max-width: 800px) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)) } }

@keyframes fadeout { to { opacity: 0; height: 0 } }

<body>
<div class="app">
  <aside class="side">
    <a class="brand" href="#/"><svg viewBox="0 0 32 32" aria-hidden="true"><rect x="2" y="2" width="28" height="28" rx="6" fill="none" stroke="#F2E35B" stroke-width="2.2"/><path d="M9 16.5l4.5 4.5L23 11" stroke="#F2E35B" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg><span>AuthPilot</span></a>
    <div>
      <p class="grp">Work</p>
      <nav aria-label="Work">
        <a href="#/queue" data-nav="queue"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Review queue<span class="count due" id="nav-due"></span></a>
        <a href="#/case" data-nav="case"><svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h3"/></svg>Open case</a>
        <a href="#/simulator" data-nav="simulator"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>New patient</a>
      </nav>
    </div>
    <div>
      <p class="grp">Insight</p>
      <nav aria-label="Insight">
        <a href="#/runs" data-nav="runs"><svg viewBox="0 0 24 24"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg>Agent runs<span class="count" id="nav-runs"></span></a>
        <a href="#/evaluation" data-nav="evaluation"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Evaluation</a>
        <a href="#/policies" data-nav="policies"><svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5"/></svg>Policies<span class="count">5</span></a>
        <a href="#/system" data-nav="system"><svg viewBox="0 0 24 24"><circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="12" cy="18" r="2.5"/><path d="M8 7l3 9M16 7l-3 9M8.5 6h7"/></svg>How it works</a>
      </nav>
    </div>
    <div class="me"><b>Reviewer: you</b>Synthetic patients only. Your sign-offs stay in this browser.</div>
  </aside>
  <div class="main">
    <div class="top">
      <label class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input id="q" type="search" placeholder="Find a member, request ID or service" aria-label="Find a request"></label>
      <span class="demo">Demo workspace</span>
      <span class="status" id="svc" title="The live agent service"><i></i><span>Checking agents</span></span>
    </div>
    <main class="view" id="view" tabindex="-1"></main>
  </div>
</div>
<div class="tip" id="tip" role="tooltip"></div>

<script>
const DATA = /*DATA*/null;
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const md = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/^#+\s*/gm, "").replace(/^---$/gm, "").replace(/\n{3,}/g, "\n\n").trim();
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
const LABEL = { cpap_eval: "Evaluated before the sleep test", cpap_test: "Sleep test result", cpap_symptoms: "Symptoms or heart risk",
  cpap_education: "Supplier taught the patient", o2_test: "Oxygen test result", o2_group2: "Group II condition", o2_timing: "Test within 30 days",
  o2_tester: "Qualified tester", bar_bmi: "BMI 35 or more", bar_comorbid: "Obesity-related condition", bar_prior: "Tried medical weight loss",
  bar_procedure: "Covered procedure", icd_indication: "Heart function and class", icd_gdmt: "Three months of therapy", icd_sdm: "Shared decision visit",
  icd_exclusions: "No recent heart attack or stent", cgm_dx: "Diabetes diagnosis", cgm_need: "Insulin or severe lows", cgm_visit: "Visit within 6 months" };
const STATUS = { met: ["Met", "✓"], not_met: ["Not met", "✕"], missing: ["Undocumented", "?"], not_applicable: ["Not needed", "–"] };
const DEC = { APPROVE: "Approved", DENY: "Denied", NEED_INFO: "Records requested" };
const DEC_SUB = { APPROVE: "Coverage criteria met", DENY: "Awaiting clinician sign-off", NEED_INFO: "Sent back to the provider" };
const NAME = { baseline: "Single AI call", single_plus: "Single call with the same code checks", authpilot: "AuthPilot" };
const POLICY_SHORT = { cpap: "CPAP machine", oxygen: "Home oxygen", bariatric: "Weight-loss surgery", icd: "Defibrillator", cgm: "Glucose monitor" };
const LANES = [["cond", "Diagnoses"], ["obs", "Tests and vitals"], ["doc", "Clinical notes"], ["enc", "Visits"], ["med", "Medications"], ["proc", "Procedures"], ["order", "Orders"]];
const WINDOW_TEXT = { o2_timing: "30-day test window", cgm_visit: "6-month visit window", icd_exclusions: "90-day stent window" };
const STEPS = [["intake", "Read request", "ai"], ["policy", "Pick policy", "code"], ["record", "Fetch record", "code"], ["specialist", "Specialists", "ai"],
  ["verify", "Verify", "code"], ["investigator", "Investigator", "ai"], ["letter", "Letter", "ai"]];
const ORDER = STEPS.map(s => s[0]);
const HOOKS = { "0181": "The provider says every rule is met. A stent placed 84 days earlier says otherwise.",
  "0246": "Also “meets all criteria”. Code catches that the last diabetes visit falls outside six months.",
  "0123": "No supervised diet program on file. The investigator searches the chart before asking the surgeon.",
  "0002": "The sleep test qualifies, but nothing shows an evaluation before it. Records requested, not a denial.",
  "0188": "Approved, with the deciding evidence buried in free-text clinical notes.",
  "0061": "An SpO2 of 89% only qualifies alongside a Group II condition. The specialist finds one." };
const Q = DATA.queue.map(r => ({ n: r[0], id: r[1], name: r[2], service: r[3], policy: r[4], ordered: r[5], dec: r[6], truth: r[7], cites: r[8], secs: r[9], cost: r[10], split: r[11], calls: r[12], toks: r[13], at: r[14] }));
const QI = Object.fromEntries(Q.map(r => [r.n, r]));
const ruleText = t => esc(t).replace(/\*\*([a-z0-9_]+)\*\*/g, (m, k) => LABEL[k] ? `\u201c${LABEL[k]}\u201d` : k);
const pct = x => (Math.round(x * 1000) / 10) + "%";
const median = a => { const s = [...a].sort((x, y) => x - y); return s.length ? (s[(s.length - 1) >> 1] + s[s.length >> 1]) / 2 : 0; };
const quant = (a, q) => { const s = [...a].sort((x, y) => x - y); return s[Math.min(s.length - 1, Math.floor(q * s.length))]; };

/* ---------- reviewer actions (this browser only) */
const store = { get() { try { return JSON.parse(localStorage.getItem("authpilot.actions") || "{}"); } catch { return {}; } },
  put(all) { try { localStorage.setItem("authpilot.actions", JSON.stringify(all)); } catch {} },
  set(n, v) { const a = store.get(); a[n] = v; store.put(a); }, drop(n) { const a = store.get(); delete a[n]; store.put(a); } };
function queueStatus(r) { const a = store.get()[r.n]; if (a) return a.kind; return r.dec === "DENY" ? "due" : r.dec === "NEED_INFO" ? "sent" : r.dec === "APPROVE" ? "approved" : "error"; }
const QS = { due: ["Needs sign-off", "due"], sent: ["Records requested", "NEED_INFO"], approved: ["Approved", "APPROVE"], signed: ["Denial signed", "signed"],
  overturned: ["Overturned to approval", "APPROVE"], confirmed: ["Confirmed", "APPROVE"], flagged: ["Flagged for review", "plain"], error: ["No decision", "plain"] };
const HANDLED = ["signed", "overturned", "confirmed", "flagged"];
function refreshNav() { const due = Q.filter(r => queueStatus(r) === "due").length; $("#nav-due").textContent = due || ""; $("#nav-due").hidden = !due; $("#nav-runs").textContent = Q.length; }

/* ---------- tooltip */
const tip = $("#tip");
function showTip(html, ev) { tip.innerHTML = html; tip.classList.add("on"); const r = ev.target.getBoundingClientRect(), w = tip.offsetWidth, h = tip.offsetHeight;
  let x = r.left + r.width / 2 - w / 2, y = r.top - h - 10; if (y < 8) y = r.bottom + 10; tip.style.left = Math.max(8, Math.min(innerWidth - w - 8, x)) + "px"; tip.style.top = y + "px"; }
const hideTip = () => tip.classList.remove("on");
addEventListener("scroll", hideTip, { passive: true });
function hover(el, html) { el.onmouseenter = el.onfocus = ev => showTip(typeof html === "function" ? html() : html, ev); el.onmouseleave = el.onblur = hideTip; }

/* ---------- live service status */
let svcState = "unknown";
function setSvc(s, text) { svcState = s; const el = $("#svc"); el.className = "status " + s; $("span", el).textContent = text; }
async function ping() {
  if (!DATA.api) { setSvc("off", "Live agents offline here"); return; }
  setSvc("wake", "Waking the agents");
  const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 75000);
  try { const r = await fetch(DATA.api + "/health", { signal: ctl.signal }); setSvc(r.ok ? "on" : "off", r.ok ? "Agents online" : "Agents unavailable"); }
  catch { setSvc("off", "Agents unavailable"); }
  clearTimeout(t);
}

/* ---------- data */
const cache = {}, BUILT = {};
async function getCase(n) {
  if (BUILT[n]) return BUILT[n];
  if (!cache[n]) { const r = await fetch(`data/cases/${n}.json`); if (!r.ok) throw new Error("case not found"); cache[n] = await r.json(); }
  return cache[n];
}

/* ---------- router */
let lastCase = null;
function route() {
  hideTip();
  const [view, arg, tab] = (location.hash.replace(/^#\/?/, "") || "home").split("/");
  if (["story", "proof"].includes(view)) return;
  document.body.classList.toggle("home", view === "home" || !view);
  $$(".side nav a").forEach(a => a.dataset.nav === view ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current"));
  const fn = { home: viewHome, queue: viewQueue, case: viewCase, runs: viewRuns, evaluation: viewEval, policies: viewPolicies, simulator: viewSim, system: viewSystem }[view] || viewQueue;
  fn($("#view"), arg, tab);
  scrollTo(0, 0);
}
addEventListener("hashchange", route);
$("#q").addEventListener("input", e => { qstate.text = e.target.value; qstate.page = 0; if (!/^#\/queue/.test(location.hash) && location.hash) location.hash = "#/queue"; else drawQueueTable(); });

/* =========================================================== QUEUE */
const qstate = { tab: "all", policy: "", text: "", page: 0, sort: "n", dir: 1 };
function viewQueue(v) {
  refreshNav();
  const st = Q.map(queueStatus), cnt = k => st.filter(s => s === k).length, agree = Q.filter(r => r.dec === r.truth).length;
  v.innerHTML = `<div class="vhead"><div><h1>Review queue</h1><p>Every request here has been reviewed by the agents against its Medicare policy. Approvals and records requests go out on their own. Denials wait for a clinician to sign.</p></div></div>
  <div class="kpis">
    <button class="kpi due" data-tab="due"><span>Waiting for your sign-off</span><b>${cnt("due")}</b><span>denials the agents recommend</span></button>
    <button class="kpi" data-tab="sent"><span>Records requested</span><b>${cnt("sent")}</b><span>a rule was undocumented</span></button>
    <button class="kpi" data-tab="approved"><span>Approved by the agents</span><b>${cnt("approved")}</b><span>every rule met, with evidence</span></button>
    <div class="kpi"><span>Median review time</span><b>${median(Q.map(r => r.secs)).toFixed(1)}s</b><span>about $${(Q.reduce((a, r) => a + r.cost, 0) / Q.length).toFixed(3)} per request</span></div>
    <div class="kpi"><span>Agrees with the answer key</span><b>${pct(agree / Q.length)}</b><span>${agree} of ${Q.length} requests</span></div>
  </div>
  <section class="panel"><header><h2>Worth a look first</h2><span>Six requests that show what the agents do</span></header>
    <div class="pad featured">${DATA.featured.map(n => { const r = QI[n]; return `<a class="feat" href="#/case/${n}"><span class="k"><span>${esc(r.id)}</span><span class="chip ${r.dec}">${DEC[r.dec]}</span></span><b>${esc(r.name)}, ${POLICY_SHORT[r.policy].toLowerCase()}</b><p>${esc(HOOKS[n] || "")}</p></a>`; }).join("")}</div></section>
  <section class="panel">
    <div class="toolbar">
      <div class="seg" role="group" aria-label="Status">${[["all", "All", Q.length], ["due", "Needs sign-off", cnt("due")], ["sent", "Records requested", cnt("sent")], ["approved", "Approved", cnt("approved")], ["done", "Handled by you", st.filter(s => HANDLED.includes(s)).length]]
        .map(([k, t, c]) => `<button data-tab="${k}" aria-pressed="${qstate.tab === k}">${t}<em>${c}</em></button>`).join("")}</div>
      <select id="qpol" aria-label="Service"><option value="">All services</option>${Object.entries(POLICY_SHORT).map(([k, t]) => `<option value="${k}"${qstate.policy === k ? " selected" : ""}>${t}</option>`).join("")}</select>
    </div>
    <div class="tw"><table id="qt"></table></div><div class="pager" id="qp"></div>
  </section>`;
  $$("[data-tab]", v).forEach(b => b.onclick = () => { qstate.tab = b.dataset.tab; qstate.page = 0; viewQueue(v); });
  $("#qpol").onchange = e => { qstate.policy = e.target.value; qstate.page = 0; drawQueueTable(); };
  drawQueueTable();
}
function drawQueueTable() {
  if (!$("#qt")) return;
  const t = qstate.text.trim().toLowerCase();
  let rows = Q.filter(r => { const s = queueStatus(r);
    if (qstate.tab === "done" ? !HANDLED.includes(s) : qstate.tab !== "all" && s !== qstate.tab) return false;
    if (qstate.policy && r.policy !== qstate.policy) return false;
    return !t || (r.name + " " + r.id + " " + r.service + " " + POLICY_SHORT[r.policy]).toLowerCase().includes(t); });
  const key = { n: r => r.n, ordered: r => r.ordered, secs: r => r.secs, cites: r => r.cites, dec: r => r.dec }[qstate.sort];
  rows.sort((a, b) => (key(a) > key(b) ? 1 : key(a) < key(b) ? -1 : 0) * qstate.dir);
  const per = 25, pages = Math.max(1, Math.ceil(rows.length / per)); qstate.page = Math.min(qstate.page, pages - 1);
  const page = rows.slice(qstate.page * per, qstate.page * per + per);
  const sh = (k, t, cls = "") => `<th class="${cls}"><button data-sort="${k}">${t}${qstate.sort === k ? (qstate.dir > 0 ? " ↑" : " ↓") : ""}</button></th>`;
  $("#qt").innerHTML = `<thead><tr>${sh("n", "Request")}<th>Service</th>${sh("ordered", "Ordered")}${sh("dec", "Agent decision")}<th>Status</th>${sh("cites", "Evidence", "r")}${sh("secs", "Review time", "r")}<th class="r">Answer key</th></tr></thead><tbody>` +

function hist(el, vals, step, fmt) {

}

  $$(".qchip", li).forEach(b => b.onclick = () => { if (curTab !== "evidence") selectTab("evidence"); const d = $(`#map .dot[data-id="${b.dataset.id}"]`); if (d) { d.classList.remove("ping"); void d.offsetWidth; d.classList.add("ping"); d.scrollIntoView({ block: "center", inline: "center", behavior: reduced ? "auto" : "smooth" }); } });
}
function typing(text) { const t = $("#typing"); if (t) t.innerHTML = text ? `<i><b></b><b></b><b></b></i>${esc(text)}` : ""; }
const chatCtx = { quotes: 0, judged: new Set(), invUsed: false };
function chatFor(e, t, anim) {
  const keys = Object.keys(crit), o = { t, anim };
  if (e.node === "intake") say("intake", `Request read: <b>${esc(C.request.service)}</b>, ordered ${esc(C.request.order_date)} by ${esc(C.request.ordering_provider)}. The provider writes “${esc(C.request.clinical_summary)}”. I'll pass that on as a claim, not evidence.`, o);
  else if (e.node === "policy") say("policy", `${esc(e.summary)}. That policy has ${keys.length} rules, so I'm assigning ${keys.length} specialists: ${keys.map(k => `<b>${esc(LABEL[k])}</b>`).join(", ")}.`, o);
  else if (e.node === "record") say("record", `${esc(e.summary)}. Every specialist gets the whole record.`, o);
  else if (e.node === "specialist") {
    const again = chatCtx.judged.has(e.criterion); chatCtx.judged.add(e.criterion); chatCtx.quotes += (e.citations || []).length;
    say("s_" + e.criterion, `${again ? "Second look. " : ""}<b>${STATUS[e.status] ? STATUS[e.status][0] : esc(e.status)}.</b> ${esc((e.reason || "").slice(0, 260))}${(e.reason || "").length > 260 ? "…" : ""}<div class="qs">${(e.citations || []).map(q => `<button class="qchip" data-id="${esc(q.id)}" title="${esc(q.quote)}">${esc(q.id)}</button>`).join("")}</div>`, { ...o, status: e.status });
  } else if (e.node === "verify") {
    const wp = e.window_problems || {};
    if (Object.keys(wp).length) say("verify", Object.entries(wp).map(([k, m]) => `<span class="at">@${esc(LABEL[k])}</span> your date doesn't hold: ${esc(m)}. Look again with the right count.`).join("<br>"), o);
    else { const u = e.unverified_citations || 0, over = (e.overrides || []).map(x => { const [k, ...r] = x.split(": "); return `<br><span class="at">@${esc(LABEL[k] || k)}</span> ${esc(r.join(": "))}`; }).join("");
      say("verify", `Checked ${chatCtx.quotes} quote${chatCtx.quotes === 1 ? "" : "s"} against the record: ${u ? `<b>${u} not found, so not counted</b>` : "<b>every one is there</b>"}. Dates and codes checked in code.${over} ${esc(e.summary)}.`, o); }
  } else if (e.node === "investigator") { chatCtx.invUsed = true; say("investigator", `${esc(e.summary)}.<div class="tools">${(e.tool_calls || []).map(esc).join("<br>")}</div>`, o); }
  else if (e.node === "letter") say("letter", "Letter drafted from verified findings only. It's on the Letter tab.", o);
}
function chatVerdict(r, anim) {
  const a = store.get()[lastCase];
  say("verdict", `<b>${DEC[r.decision] || "No decision"}.</b> ${DEC_SUB[r.decision] || ""}. ${r.seconds != null ? `${r.seconds.toFixed(1)} seconds` : ""}${r.cost != null ? `, $${r.cost.toFixed(3)}` : ""}.${C.answer_key ? ` The answer key says ${DEC[C.answer_key.decision].toLowerCase()}: ${C.answer_key.decision === r.decision ? "agreed" : "disagreed"}.` : ""}${a ? ` ${QS[a.kind][0]} by you.` : ""}`, { anim });
}
function resetChat() { const th = $("#thread"); if (th) th.innerHTML = ""; chatCtx.quotes = 0; chatCtx.judged = new Set(); chatCtx.invUsed = false; typing(""); }
function buildChat(r) {
  resetChat(); if (!r) { say("verdict", "Nobody has reviewed this patient yet. Press <b>Run the agents live</b> and the team will start.", { anim: false }); return; }
  const t0 = r.trace[r.trace.length - 1].t - (r.seconds || 0);
  [...r.trace].sort((a, b) => a.t - b.t).forEach(e => chatFor(e, Math.max(0, e.t - t0), false)); chatVerdict(r, false);
}

/* ----- the network following the run */
let NET = null;
function initNet() { const svg = $("#net"); if (!svg) return; NET = createNet(svg, Object.keys(crit), shortName); }
function netFinal(r) {
  if (!NET) return; NET.reset();
  if (!r) return;
  ["fax", "intake", "policy", "record", "verify", "letter"].forEach(k => NET.node(k, "done"));
  NET.node("investigator", r.trace.some(e => e.node === "investigator") ? "done" : "skipped");
  for (const [k, v] of Object.entries(r.criteria || {})) NET.spec(k, v.status);
  NET.node("verdict", r.decision);
}
function netStep(e) {
  const N = NET; if (!N) return; const keys = Object.keys(crit);
  if (e.node === "intake") { N.node("intake", "done"); N.flow("fax", "intake", false); N.node("policy", "active"); N.pulse("intake", "policy", 900); typing("Router is matching the policy"); }
  else if (e.node === "policy") { N.node("policy", "done"); N.node("record", "active"); N.pulse("policy", "record", 900); typing("Fetching the record over MCP"); }
  else if (e.node === "record") { N.node("record", "done"); keys.forEach(k => { if (!crit[k].status) { N.node("s_" + k, "active"); N.flow("record", "s_" + k, true); N.pulse("policy", "s_" + k, 1200); } }); typing(`${keys.length} specialists are reading the record`); }
  else if (e.node === "specialist") { N.spec(e.criterion, e.status); N.flow("record", "s_" + e.criterion, false); N.flow("verify", "s_" + e.criterion, false); N.pulse("s_" + e.criterion, "verify", 1300, e.status === "not_met" ? "red" : "");
    const left = keys.filter(k => !crit[k].status).length; typing(left ? `${left} specialist${left > 1 ? "s" : ""} still reading` : "Verifier is checking every quote"); if (!left) N.node("verify", "active"); }
  else if (e.node === "verify") { const wp = Object.keys(e.window_problems || {});
    if (wp.length) { N.node("verify", "active"); wp.forEach(k => { N.node("s_" + k, "active"); N.flow("verify", "s_" + k, true); }); typing("A specialist is taking a second look"); }
    else { N.node("verify", "done"); const missing = Object.values(e.statuses || {}).includes("missing");
      if (missing && !chatCtx.invUsed) { N.node("investigator", "active"); N.flow("verify", "investigator", true); N.flow("investigator", "record", true); typing("Investigator is searching the record"); }
      else { N.node("letter", "active"); N.flow("verify", "letter", true); typing("Scribe is drafting the letter"); } } }
  else if (e.node === "investigator") { N.node("investigator", "done"); N.flow("verify", "investigator", false); N.flow("investigator", "record", false);
    keys.forEach(k => { if (crit[k].status === "missing") { N.node("s_" + k, "active"); N.flow("record", "s_" + k, true); } }); typing("Second look at the undocumented rules"); }
  else if (e.node === "letter") { N.node("letter", "done"); N.flow("verify", "letter", false); N.flow("letter", "verdict", true); typing(""); }
}

function countUp() {

    reduced ? b.textContent = end + "%" : requestAnimationFrame(f); });
}
function heroLoop() {
  const svg = $("#hnet"); if (!svg) return;

  let start = 0; const T = [];

  at(1300, () => { N.flow("fax", "intake", false); N.node("intake", "done"); N.node("policy", "active"); N.pulse("intake", "policy", 800); });
  at(2100, () => { N.node("policy", "done"); N.node("record", "active"); N.pulse("policy", "record", 700); });
  at(2800, () => { N.node("record", "done"); keys.forEach(k => { N.node("s_" + k, "active"); N.flow("record", "s_" + k, true); N.pulse("policy", "s_" + k, 1000); }); });
  [["icd_gdmt", 4300], ["icd_exclusions", 4900], ["icd_indication", 5300], ["icd_sdm", 5600]].forEach(([k, ms]) => at(ms, () => { N.spec(k, st[k]); N.flow("record", "s_" + k, false); N.pulse("s_" + k, "verify", 1100, st[k] === "not_met" ? "red" : ""); }));
  at(5900, () => N.node("verify", "active"));
  at(6800, () => { N.node("verify", "done"); N.node("letter", "active"); N.flow("verify", "letter", true); });
  at(8300, () => { N.flow("verify", "letter", false); N.node("letter", "done"); N.pulse("letter", "verdict", 900); });
  at(9000, () => { N.node("verdict", "DENY"); $("#hstamp").classList.add("on"); $("#hmode").innerHTML = "<i></i>Denied in 8.5s"; });
  at(13500, () => { $("#hmode").innerHTML = "<i></i>Reviewing PA-20250181"; });
  let idx = 0;
  const run = now => { if (!svg.isConnected) return; if (!start) start = now; const el = now - start;
    while (idx < T.length && T[idx][0] <= el) T[idx++][1]();
    if ($("#hclock")) $("#hclock").textContent = (Math.min(el, 8500) / 1000).toFixed(1) + "s";
    if (idx >= T.length) { start = now; idx = 0; }
    requestAnimationFrame(run); };
  requestAnimationFrame(run);
}
