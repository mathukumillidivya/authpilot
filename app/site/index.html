<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AuthPilot, the review desk</title>
<meta name="description" content="AI agents review prior authorization requests against Medicare policy. Every finding is a highlighted quote from the patient's record, checked by code, and denials wait for a clinician to sign.">
<meta name="theme-color" content="#0E1A2E">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='3' width='26' height='26' rx='4' fill='%23fff' stroke='%230E1A2E' stroke-width='2'/%3E%3Crect x='7' y='9' width='18' height='5' fill='%23FFE14D'/%3E%3Cpath d='M8 21l3.5 3.5L19 17' stroke='%23C8102E' stroke-width='3' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,600;6..72,700;6..72,800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root {
  color-scheme: light;
  --desk: #E9EDF1; --paper: #FFFFFF; --paper2: #FCFBF7; --ink: #13203A; --ink2: #3E4A63; --dim: #6A7488; --rule: #DCE1E8; --rule2: #C9D0DA;
  --night: #0E1A2E; --night2: #17263F; --night3: #24375A;
  --hl: #FFE14D; --hl-soft: #FFF3A8; --pen: #1F48C9; --pen-soft: #E3EAFF;
  --deny: #C8102E; --deny-soft: #FCE4E7; --ok: #0E7A4A; --ok-soft: #DDF3E8; --ask: #A35F00; --ask-soft: #FFF0D6; --na: #7A8396; --na-soft: #EEF0F4;
  --serif: "Newsreader", Georgia, "Times New Roman", serif;
  --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --shadow: 0 1px 0 rgba(19,32,58,.04), 0 14px 30px -18px rgba(19,32,58,.35);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
[hidden] { display: none !important; }
body { font: 15.5px/1.55 var(--sans); color: var(--ink); background: var(--desk); -webkit-font-smoothing: antialiased; }
::selection { background: var(--hl); color: var(--ink); }
button, select, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; }
a { color: var(--pen); }
:focus-visible { outline: 2.5px solid var(--pen); outline-offset: 2px; }
.wrap { max-width: 1360px; margin: 0 auto; padding: 0 32px; }
.mono { font-family: var(--mono); }
.serif { font-family: var(--serif); }
mark { background: none; color: inherit; }

/* ---------- top bar */
.top { position: sticky; top: 0; z-index: 40; background: var(--night); color: #fff; }
.top .wrap { display: flex; align-items: center; gap: 22px; height: 60px; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: #fff; font: 700 22px/1 var(--serif); letter-spacing: -.01em; }
.brand svg { flex: none; }
.nav { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
.nav a { color: #B8C3D6; text-decoration: none; padding: 7px 12px; border-radius: 6px; font-weight: 500; font-size: 14.5px; white-space: nowrap; position: relative; }
.nav a:hover { color: #fff; }
.nav a[aria-current="page"] { color: #fff; }
.nav a[aria-current="page"]::after { content: ""; position: absolute; left: 12px; right: 12px; bottom: 1px; height: 4px; background: var(--hl); border-radius: 2px; }
.nav .count { display: inline-block; margin-left: 6px; font: 600 11px var(--mono); background: var(--deny); color: #fff; border-radius: 999px; padding: 1px 6px; }
.svc { margin-left: auto; display: flex; align-items: center; gap: 8px; font: 500 12px var(--mono); color: #B8C3D6; white-space: nowrap; }
.svc i { width: 8px; height: 8px; border-radius: 50%; background: #7A8396; }
.svc.on i { background: #3EDB8F; box-shadow: 0 0 0 4px rgba(62,219,143,.18); }
.svc.wake i { background: var(--hl); animation: blink 1s infinite; }
.svc.off i { background: #E05A6A; }
@keyframes blink { 50% { opacity: .3; } }

/* ---------- shared bits */
.btn { display: inline-flex; align-items: center; gap: 9px; padding: 12px 20px; border-radius: 8px; font-weight: 600; font-size: 15px; text-decoration: none; border: 1.5px solid var(--ink); color: var(--ink); background: var(--paper); transition: transform .12s, box-shadow .12s; }
.btn:hover { transform: translateY(-1px); box-shadow: 0 4px 0 var(--ink); }
.btn.ink { background: var(--ink); color: #fff; }
.btn.hl { background: var(--hl); border-color: var(--ink); color: var(--ink); }
.btn.red { background: var(--deny); border-color: var(--deny); color: #fff; }
.btn.green { background: var(--ok); border-color: var(--ok); color: #fff; }
.btn.sm { padding: 7px 12px; font-size: 13.5px; }
.btn:disabled { opacity: .45; cursor: default; transform: none; box-shadow: none; }
.btn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.kicker { font: 600 11.5px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--deny); }
.h1 { font: 700 clamp(36px, 4.4vw, 60px)/1.02 var(--serif); letter-spacing: -.02em; }
.h2 { font: 700 clamp(30px, 3.2vw, 44px)/1.06 var(--serif); letter-spacing: -.015em; }
.lead { font-size: 18px; color: var(--ink2); max-width: 46em; }
.sheet { background: var(--paper); border: 1px solid var(--rule); border-radius: 4px; box-shadow: var(--shadow); }
.chip { display: inline-flex; align-items: center; gap: 6px; font: 600 11.5px var(--mono); padding: 3px 8px; border-radius: 4px; background: var(--na-soft); color: var(--ink2); white-space: nowrap; }
.chip.APPROVE { background: var(--ok-soft); color: var(--ok); } .chip.DENY { background: var(--deny-soft); color: var(--deny); } .chip.NEED_INFO { background: var(--ask-soft); color: var(--ask); }
.chip.due { background: var(--deny); color: #fff; } .chip.signed { background: var(--ink); color: #fff; }
.vhead { padding: 40px 0 24px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 16px 32px; align-items: end; }
.vhead p { color: var(--ink2); max-width: 52em; margin-top: 10px; }
.empty { padding: 30px; color: var(--dim); text-align: center; }
.note { font-size: 13px; color: var(--dim); }
.tip { position: fixed; z-index: 80; pointer-events: none; background: var(--night); color: #fff; border-radius: 6px; padding: 8px 11px; font-size: 12.5px; max-width: 320px; opacity: 0; transition: opacity .12s; }
.tip.on { opacity: 1; }
.tip .mono { font-size: 11.5px; color: #B8C3D6; margin-top: 4px; }

/* stamps */
.stamp { display: inline-block; font: 800 22px/1 var(--serif); letter-spacing: .08em; text-transform: uppercase; padding: 8px 14px 7px; border: 3.5px solid currentColor; border-radius: 6px; transform: rotate(-6deg); mix-blend-mode: multiply; position: relative; }
.stamp small { display: block; font: 600 9.5px var(--mono); letter-spacing: .04em; margin-top: 4px; text-transform: none; }
.stamp::after { content: ""; position: absolute; inset: 0; background: radial-gradient(circle at 20% 30%, rgba(255,255,255,.55) 0 2px, transparent 3px), radial-gradient(circle at 70% 60%, rgba(255,255,255,.5) 0 1.5px, transparent 2.5px), radial-gradient(circle at 45% 80%, rgba(255,255,255,.5) 0 2px, transparent 3px); background-size: 23px 17px, 31px 21px, 19px 25px; }
.stamp.DENY { color: var(--deny); } .stamp.APPROVE { color: var(--ok); } .stamp.NEED_INFO { color: #1E5AA8; } .stamp.none { color: var(--rule2); }
.stamp.slam { animation: slam .5s cubic-bezier(.2, 1.6, .4, 1) both; }
@keyframes slam { from { transform: rotate(-6deg) scale(2.4); opacity: 0; } 60% { opacity: 1; } to { transform: rotate(-6deg) scale(1); } }

/* ---------- home hero: a light table with the case papers on it */
.hero { background: var(--night); color: #fff; position: relative; overflow: hidden; }
.hero::before { content: ""; position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px); background-size: 32px 32px; }
.hero::after { content: ""; position: absolute; inset: 0; background: radial-gradient(800px 500px at 75% 45%, rgba(255,225,77,.12), transparent 60%); pointer-events: none; }
.hero .wrap { position: relative; z-index: 1; display: grid; grid-template-columns: minmax(0, .9fr) minmax(0, 1.1fr); gap: 40px; align-items: center; padding-top: 56px; padding-bottom: 64px; }
.hero .kicker { color: var(--hl); }
.hero h1 { font: 700 clamp(44px, 5.4vw, 80px)/.98 var(--serif); letter-spacing: -.025em; margin: 16px 0 20px; }
.hero h1 mark { background: linear-gradient(transparent 58%, rgba(255,225,77,.9) 58% 92%, transparent 92%); color: #fff; padding: 0 .05em; }
.hero p { font-size: 18px; color: #C7D0DF; max-width: 33em; }
.hero .acts { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 28px; }
.hero .btn { border-color: #fff; }
.hero .btn.hl { border-color: var(--hl); }
.hero .btn:not(.hl) { background: transparent; color: #fff; }
.hero .btn:hover { box-shadow: 0 4px 0 var(--hl); }
.table { position: relative; height: 640px; }
.doc { position: absolute; background: var(--paper2); color: var(--ink); border-radius: 3px; box-shadow: 0 30px 50px -25px rgba(0,0,0,.65), 0 2px 0 rgba(0,0,0,.08); transition: transform .6s; }
.doc .dh { display: flex; justify-content: space-between; gap: 8px; font: 600 9.5px var(--mono); color: var(--dim); padding: 10px 14px 8px; border-bottom: 1px dashed var(--rule2); text-transform: uppercase; letter-spacing: .04em; }
.doc.fax { left: 0; top: 0; width: 290px; transform: rotate(-4deg); padding-bottom: 14px; font: 400 11px/1.6 var(--mono); filter: contrast(1.05); }
.doc.fax .fx { padding: 10px 14px 0; white-space: pre-wrap; }
.doc.fax .claim { position: relative; display: inline; }
.doc.fax .claim.struck { background: linear-gradient(transparent 46%, var(--deny) 46% 56%, transparent 56%); }
.doc.fax .margin { display: block; margin-top: 6px; font: 600 14px/1.2 var(--serif); font-style: italic; color: var(--deny); opacity: 0; transform: rotate(-2deg); transition: opacity .4s; }
.doc.fax .margin.on { opacity: 1; }
.doc.chart { left: 90px; top: 235px; width: 420px; transform: rotate(1.5deg); z-index: 2; padding-bottom: 10px; }
.doc.chart .ln { padding: 5px 14px; font: 400 11px/1.45 var(--mono); border-bottom: 1px solid #EFEDE6; color: var(--ink2); }
.doc.chart .ln b { font-weight: 600; color: var(--dim); margin-right: 6px; }
.sweep { background: linear-gradient(90deg, var(--hl) 0 0) no-repeat; background-size: 0% 100%; transition: background-size .9s ease-out; padding: 1px 0; color: var(--ink); }
.sweep.on { background-size: 100% 100%; }
.doc.chart .tag { display: block; font: 600 13px/1.2 var(--serif); font-style: italic; color: var(--pen); padding: 4px 14px 0; opacity: 0; transition: opacity .4s; }
.doc.chart .tag.on { opacity: 1; }
.doc.list { right: 0; top: 10px; width: 280px; transform: rotate(-1.5deg); z-index: 3; padding: 12px 14px 14px; }
.doc.list h4 { font: 700 15px/1.2 var(--serif); }
.doc.list .sub { font: 500 10px var(--mono); color: var(--dim); }
.ck { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 8px; padding: 7px 0; border-top: 1px solid #EFEDE6; font-size: 12.5px; line-height: 1.3; align-items: start; }
.ck:first-of-type { border-top: 0; margin-top: 6px; }
.ck .bx { width: 20px; height: 20px; border: 1.5px solid var(--rule2); border-radius: 3px; display: grid; place-items: center; font: 700 14px/1 var(--serif); }
.ck .bx.met { color: var(--ok); border-color: var(--ok); } .ck .bx.not_met { color: var(--deny); border-color: var(--deny); }
.ck .bx.missing { color: var(--ask); border-color: var(--ask); } .ck .bx.not_applicable { color: var(--na); }
.ck .bx.work { border-color: var(--pen); animation: blink .8s infinite; }
.ck small { display: block; font: 500 10px var(--mono); color: var(--dim); margin-top: 2px; }
.doc.letter { right: 0; bottom: 40px; width: 240px; transform: rotate(3deg); z-index: 4; padding: 18px 18px 22px; }
.doc.letter .lt { font: 700 13px var(--serif); }
.doc.letter .lb { margin-top: 8px; display: grid; gap: 5px; }
.doc.letter .lb i { display: block; height: 5px; border-radius: 3px; background: #E6E3DA; }
.doc.letter .stamp { position: absolute; right: 18px; bottom: 18px; opacity: 0; }
.doc.letter .stamp.on { opacity: 1; animation: slam .5s cubic-bezier(.2, 1.6, .4, 1) both; }
.agentbar { position: absolute; left: 0; bottom: 0; z-index: 5; background: rgba(14,26,46,.96); border: 1px solid var(--night3); border-radius: 10px; padding: 10px 12px; width: 300px; font: 500 11px/1.45 var(--mono); color: #C7D0DF; box-shadow: 0 20px 40px -20px #000; }
.agentbar b { color: var(--hl); font-weight: 600; }
.agentbar .now { min-height: 2.9em; margin-top: 4px; color: #fff; }
.agentbar .m { display: flex; gap: 14px; margin-top: 6px; color: #8E9BB2; }
.agentbar .m span b { color: #fff; }

.strip { background: var(--paper); border-bottom: 1px solid var(--rule); }
.strip .wrap { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); }
.strip .wrap > div { padding: 28px 24px 26px; border-right: 1px solid var(--rule); }
.strip .wrap > div:first-child { padding-left: 0; }
.strip .wrap > div:last-child { border-right: 0; }
.strip b { display: block; font: 700 clamp(34px, 3.4vw, 48px)/1 var(--serif); letter-spacing: -.02em; }
.strip b em { font-style: normal; color: var(--deny); }
.strip span { display: block; margin-top: 8px; color: var(--ink2); font-size: 14.5px; }
.strip s { text-decoration: none; display: block; font: 500 12px var(--mono); color: var(--dim); margin-top: 6px; }
section.blk { padding: 76px 0; }
.pipe { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 10px; margin-top: 30px; }
.slip { background: var(--paper); border: 1px solid var(--rule); border-radius: 4px; padding: 14px; box-shadow: var(--shadow); position: relative; }
.slip .ty { font: 600 10.5px var(--mono); letter-spacing: .04em; padding: 2px 6px; border-radius: 3px; }
.ty.ai { background: var(--pen-soft); color: var(--pen); } .ty.code { background: var(--ok-soft); color: var(--ok); } .ty.mcp { background: var(--ask-soft); color: var(--ask); }
.slip h3 { font: 700 18px/1.15 var(--serif); margin: 10px 0 6px; }
.slip p { font-size: 13.5px; color: var(--ink2); }
.slip.par { background: repeating-linear-gradient(0deg, var(--paper) 0 0); box-shadow: var(--shadow), 6px 6px 0 -1px var(--paper), 6px 6px 0 0 var(--rule2), 12px 12px 0 -1px var(--paper), 12px 12px 0 0 var(--rule2); }
.folders { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 22px 18px; margin-top: 34px; }
.folder { position: relative; display: block; text-decoration: none; color: var(--ink); background: #F3E2B3; border-radius: 0 6px 6px 6px; padding: 18px 18px 18px; margin-top: 16px; box-shadow: var(--shadow); transition: transform .15s; }
.folder::before { content: attr(data-tab); position: absolute; left: 0; top: -22px; height: 22px; padding: 4px 12px 0; background: #F3E2B3; border-radius: 6px 6px 0 0; font: 600 11px var(--mono); color: #6B5420; }
.folder:hover { transform: translateY(-3px) rotate(-.4deg); }
.folder b { display: block; font: 700 20px/1.2 var(--serif); }
.folder p { font-size: 14px; color: #4D4430; margin-top: 6px; }
.folder .stamp { position: absolute; right: 14px; top: 12px; font-size: 12px; padding: 4px 7px; border-width: 2px; }
.honest { background: var(--night); color: #fff; border-radius: 6px; padding: 36px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 36px; align-items: center; }
.honest q { font: 600 clamp(24px, 2.4vw, 32px)/1.25 var(--serif); quotes: "“" "”"; }
.honest p { color: #C7D0DF; }
.honest .btn { margin-top: 16px; background: transparent; color: #fff; border-color: #fff; }

/* ---------- queue */
.cards { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 14px; margin-bottom: 22px; }
.card { text-align: left; background: var(--paper); border: 1px solid var(--rule); border-top: 4px solid var(--ink); border-radius: 3px; padding: 14px 16px; box-shadow: var(--shadow); }
.card.due { border-top-color: var(--deny); }
.card span { display: block; font-size: 13px; color: var(--dim); }
.card b { display: block; font: 700 32px/1.1 var(--serif); margin: 4px 0 2px; }
button.card:hover { transform: translateY(-1px); }
.ledger { background: var(--paper); border: 1px solid var(--rule); border-radius: 3px; box-shadow: var(--shadow); overflow: hidden; margin-bottom: 60px; }
.toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 12px 14px; border-bottom: 1px solid var(--rule); background: var(--paper2); }
.seg { display: flex; flex-wrap: wrap; gap: 4px; }
.seg button { padding: 6px 11px; border-radius: 5px; font-weight: 500; font-size: 13.5px; color: var(--ink2); border: 1px solid transparent; }
.seg button[aria-pressed="true"] { background: var(--ink); color: #fff; }
.seg em { font-style: normal; font: 500 11px var(--mono); margin-left: 6px; opacity: .7; }
.toolbar select, .toolbar input { border: 1px solid var(--rule2); border-radius: 5px; padding: 7px 10px; background: #fff; font-size: 14px; }
.toolbar input { min-width: 240px; flex: 1 1 200px; max-width: 360px; }
.tw { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14.5px; }
th, td { text-align: left; padding: 11px 14px; border-bottom: 1px solid var(--rule); vertical-align: middle; }
thead th { font: 600 11px var(--mono); letter-spacing: .04em; text-transform: uppercase; color: var(--dim); background: var(--paper2); white-space: nowrap; }
thead th button { font: inherit; color: inherit; text-transform: inherit; letter-spacing: inherit; }
td.r, th.r { text-align: right; }
td.num { font-family: var(--mono); font-size: 13px; }
tr.go { cursor: pointer; }
tr.go:hover td { background: #FFFBE6; }
td .idc { display: block; font: 400 11.5px var(--mono); color: var(--dim); }
.mstamp { display: inline-block; font: 800 11.5px/1 var(--serif); letter-spacing: .08em; text-transform: uppercase; padding: 4px 6px 3px; border: 2px solid currentColor; border-radius: 3px; transform: rotate(-4deg); }
.mstamp.DENY { color: var(--deny); } .mstamp.APPROVE { color: var(--ok); } .mstamp.NEED_INFO { color: #1E5AA8; }
.agree { font: 600 12px var(--mono); color: var(--ok); } .disagree { font: 600 12px var(--mono); color: var(--deny); }
.pager { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 12px 14px; font-size: 13.5px; color: var(--dim); }
.pager div { display: flex; gap: 8px; }

/* ---------- case: the review desk */
.casehead { padding: 26px 0 16px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 14px 28px; align-items: end; }
.crumbs { font: 500 12px var(--mono); color: var(--dim); margin-bottom: 8px; } .crumbs a { color: var(--dim); }
.casehead h1 { font: 700 clamp(32px, 3.6vw, 48px)/1 var(--serif); letter-spacing: -.02em; }
.casehead .meta { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 10px; font-size: 14px; color: var(--ink2); align-items: center; }
.casehead .acts { display: flex; gap: 10px; flex-wrap: wrap; }
.run { background: var(--night); color: #fff; border-radius: 6px; padding: 14px 16px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px 24px; align-items: center; margin-bottom: 18px; }
.steps { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.step { display: inline-flex; align-items: center; gap: 6px; padding: 6px 9px; border-radius: 5px; background: var(--night2); font: 500 12px var(--mono); color: #8E9BB2; border: 1px solid var(--night3); transition: background .3s, color .3s; }
.step i { font-style: normal; font-size: 9.5px; padding: 1px 5px; border-radius: 3px; background: var(--night3); color: #B8C3D6; }
.step.active { background: var(--hl); color: var(--ink); border-color: var(--hl); }
.step.active i { background: rgba(19,32,58,.15); color: var(--ink); }
.step.done { color: #fff; border-color: #3B5280; }
.step.done::before { content: "✓"; color: #3EDB8F; }
.step.skip { opacity: .4; }
.step .sp { display: inline-flex; gap: 3px; }
.step .sp b { width: 8px; height: 8px; border-radius: 2px; background: var(--night3); }
.step .sp b.work { background: var(--hl); animation: blink .7s infinite; } .step .sp b.met { background: #3EDB8F; } .step .sp b.not_met { background: #FF6B7D; } .step .sp b.missing { background: #FFB443; } .step .sp b.not_applicable { background: #8E9BB2; }
.arrow { color: #4C5F82; font-size: 12px; }
.now { grid-column: 1 / -1; font: 500 12.5px var(--mono); color: #C7D0DF; display: flex; gap: 10px; align-items: baseline; min-height: 1.5em; }
.now b { color: var(--hl); font-weight: 600; white-space: nowrap; }
.meters { display: flex; gap: 18px; }
.meters div { text-align: right; }
.meters b { display: block; font: 600 18px/1.1 var(--mono); color: #fff; }
.meters span { font: 500 10px var(--mono); color: #8E9BB2; text-transform: uppercase; letter-spacing: .05em; }
.desk { display: grid; grid-template-columns: minmax(0, 1fr) 470px; gap: 22px; align-items: start; margin-bottom: 70px; }
.docs { display: grid; gap: 18px; min-width: 0; }
.fax2 { background: #FDFDFB; border: 1px solid var(--rule); border-radius: 2px; box-shadow: var(--shadow); font: 400 13px/1.65 var(--mono); position: relative; overflow: hidden; }

.fax2 .fh { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 4px 12px; padding: 8px 16px; font-size: 11px; color: var(--dim); border-bottom: 1px solid var(--rule); background: #F6F6F1; }
.fax2 pre { white-space: pre-wrap; padding: 14px 18px 18px; font: inherit; overflow-wrap: anywhere; }
.fax2 .claimx { background: linear-gradient(transparent 55%, var(--hl-soft) 55%); }
.fax2 .mnote { display: block; padding: 0 18px 16px; font: 600 16px/1.3 var(--serif); font-style: italic; color: var(--deny); }
.record { background: var(--paper); border: 1px solid var(--rule); border-radius: 2px; box-shadow: var(--shadow); }
.record .rh { display: flex; flex-wrap: wrap; gap: 8px 16px; justify-content: space-between; align-items: center; padding: 12px 16px; border-bottom: 2px solid var(--ink); }
.record .rh h2 { font: 700 20px/1.1 var(--serif); }
.record .rh .seg button { font-size: 12.5px; padding: 5px 9px; }
.rlist { max-height: 760px; overflow-y: auto; scroll-behavior: smooth; }
.rl { display: grid; grid-template-columns: 30px 82px 96px minmax(0, 1fr); gap: 10px; padding: 7px 16px 7px 8px; border-bottom: 1px solid #F0F1F4; font-size: 13.5px; line-height: 1.45; align-items: baseline; }
.rl .tabs { display: flex; flex-direction: column; gap: 2px; align-items: center; }
.rl .tabs b { font: 700 10px/1 var(--mono); color: #fff; width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; background: var(--pen); }
.rl .rid { font: 500 11.5px var(--mono); color: var(--dim); }
.rl .rd { font: 400 11.5px var(--mono); color: var(--dim); white-space: nowrap; }
.rl .rd em { display: block; font-style: normal; color: var(--ink2); }
.rl .rt { color: var(--ink2); overflow-wrap: anywhere; }
.rl.cited { background: #FFFDF0; }
.rl.cited .rt { color: var(--ink); }
.rl.flash { animation: flash 1.4s ease-out; }
@keyframes flash { 0%, 30% { background: var(--hl-soft); } }
.q { background: linear-gradient(90deg, var(--hl) 0 0) no-repeat; background-size: 100% 100%; padding: 1px 1px; border-radius: 1px; }
.q.anim { background-size: 0% 100%; animation: swipe .8s ease-out forwards; }
@keyframes swipe { to { background-size: 100% 100%; } }
.q.miss { background: var(--deny-soft); }
.rl.hidden-row { display: none; }

.side { display: grid; gap: 18px; position: sticky; top: 76px; max-height: calc(100vh - 92px); overflow-y: auto; padding: 2px 4px 4px 2px; scrollbar-width: thin; }
.policy { background: var(--paper); border: 1px solid var(--rule); border-radius: 3px; box-shadow: var(--shadow); padding: 16px 18px; }
.policy .ph { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
.policy h2 { font: 700 19px/1.15 var(--serif); }
.policy .src { font: 500 11px var(--mono); color: var(--dim); margin-top: 4px; }
.rule { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 10px; padding: 12px 0; border-top: 1px solid var(--rule); }
.rule:first-of-type { margin-top: 10px; }
.rule .bx { width: 28px; height: 28px; border: 2px solid var(--rule2); border-radius: 4px; display: grid; place-items: center; font: 700 19px/1 var(--serif); }
.rule .bx.met { color: var(--ok); border-color: var(--ok); background: var(--ok-soft); }
.rule .bx.not_met { color: var(--deny); border-color: var(--deny); background: var(--deny-soft); }
.rule .bx.missing { color: var(--ask); border-color: var(--ask); background: var(--ask-soft); }
.rule .bx.not_applicable { color: var(--na); background: var(--na-soft); }
.rule .bx.work { border-color: var(--pen); border-style: dashed; animation: spin 2.4s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.rule .lab { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.rule .lab b { font-weight: 600; font-size: 15px; }
.rule .lab span { font: 600 11px var(--mono); white-space: nowrap; }
.rule .lab span.met { color: var(--ok); } .rule .lab span.not_met { color: var(--deny); } .rule .lab span.missing { color: var(--ask); } .rule .lab span.not_applicable { color: var(--na); }
.rule .lab span.work { color: var(--pen); }
.rule .rtext { font-size: 12.5px; color: var(--dim); margin-top: 2px; }
.rule .why { font: 400 15px/1.45 var(--serif); color: var(--ink); margin-top: 6px; }
.cites { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
.cite { display: inline-flex; align-items: center; gap: 5px; font: 500 11.5px var(--mono); padding: 3px 7px; border-radius: 3px; background: var(--hl-soft); color: var(--ink); border: 1px solid #F0D64A; }
.cite b { font-size: 10px; color: var(--ok); }
.cite.bad { background: var(--deny-soft); border-color: #F2B8C1; } .cite.bad b { color: var(--deny); }
.codecheck { margin-top: 8px; font: 500 11.5px var(--mono); color: var(--ok); display: flex; gap: 6px; align-items: baseline; }
.codecheck::before { content: "{ }"; font-weight: 600; background: var(--ok-soft); padding: 0 4px; border-radius: 3px; }
.codecheck.fix { color: var(--deny); } .codecheck.fix::before { background: var(--deny-soft); }
.verdict { background: var(--paper); border: 1px solid var(--rule); border-radius: 3px; box-shadow: var(--shadow); padding: 18px; position: relative; }
.verdict .vtop { display: flex; justify-content: space-between; gap: 14px; align-items: center; }
.verdict h3 { font: 700 17px/1.2 var(--serif); }
.verdict .how { font: 500 11.5px var(--mono); color: var(--dim); margin-top: 4px; }
.letterp { margin-top: 14px; background: var(--paper2); border: 1px solid var(--rule); padding: 18px 20px; font: 400 15px/1.55 var(--serif); white-space: pre-wrap; max-height: 360px; overflow-y: auto; position: relative; }
.letterp b { font-weight: 700; }
.letterp.typing::after { content: "▍"; color: var(--pen); animation: blink .7s infinite; }
.sign { margin-top: 14px; display: grid; gap: 10px; }
.sign textarea { width: 100%; border: 1px solid var(--rule2); border-radius: 5px; padding: 9px 11px; min-height: 60px; resize: vertical; font-size: 14px; }
.sign .row { display: flex; flex-wrap: wrap; gap: 8px; }
.signed { font: 600 22px/1.2 var(--serif); font-style: italic; color: var(--pen); border-bottom: 1.5px solid var(--ink); padding-bottom: 2px; display: inline-block; }
.key { margin-top: 14px; padding-top: 12px; border-top: 1px dashed var(--rule2); font-size: 14px; }
.key .ok { color: var(--ok); font-weight: 700; } .key .no { color: var(--deny); font-weight: 700; }
details.trace { background: var(--paper); border: 1px solid var(--rule); border-radius: 3px; box-shadow: var(--shadow); }
details.trace summary { padding: 14px 16px; cursor: pointer; font: 700 17px var(--serif); }

details.trace .ev div { display: grid; grid-template-columns: 52px 92px minmax(0, 1fr); gap: 8px; }
details.trace .ev em { font-style: normal; color: var(--dim); }
details.trace .ev b { font-weight: 600; }
details.trace table { font-size: 13px; }

/* ---------- evaluation, runs, policies, simulator, system */
.callouts { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; margin: 22px 0; }
.callout { background: var(--paper); border: 1px solid var(--rule); border-left: 5px solid var(--ink); padding: 14px 16px; box-shadow: var(--shadow); }
.callout b { display: block; font: 700 28px/1.1 var(--serif); }
.callout span { font-size: 13.5px; color: var(--ink2); }
.waffles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.wf { background: var(--paper); border: 1px solid var(--rule); padding: 18px; box-shadow: var(--shadow); border-radius: 3px; }
.wf.ours { border: 2px solid var(--ink); }

.wf .pct { font: 700 40px/1 var(--serif); margin: 8px 0 12px; }
.wf .pct small { font: 500 12px var(--mono); color: var(--dim); margin-left: 8px; }
.wf .cells { display: grid; grid-template-columns: 88px minmax(0, 1fr); gap: 6px 10px; align-items: center; }
.wf .pl { font-size: 12px; color: var(--dim); }
.wf .sq { display: grid; grid-template-columns: repeat(20, minmax(0, 1fr)); gap: 2px; }
.cell { aspect-ratio: 1; border-radius: 1.5px; background: #CBD5E3; padding: 0; }
.cell.wd { background: var(--deny); } .cell.wa { background: #6D4BD8; } .cell.ot { background: repeating-linear-gradient(45deg, #E8A33A 0 2px, #FFE7BD 2px 4px); }
.cell.lit { outline: 2px solid var(--ink); outline-offset: 1px; }
.wf ul { list-style: none; margin-top: 12px; display: grid; gap: 4px; font-size: 13px; }
.wf li { display: flex; align-items: center; gap: 8px; } .wf li i { width: 12px; height: 12px; border-radius: 2px; display: inline-block; } .wf li b { margin-left: auto; font-family: var(--mono); font-weight: 500; }
.panel { background: var(--paper); border: 1px solid var(--rule); border-radius: 3px; box-shadow: var(--shadow); }

.panel > header span { font-size: 13px; color: var(--dim); }
.pad { padding: 18px; }
.two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
.stack { display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; padding-bottom: 70px; }

.form select { width: 100%; }

.olist { list-style: none; counter-reset: o; display: grid; gap: 10px; } .olist li { counter-increment: o; display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 4px 10px; } .olist li::before { content: counter(o); grid-row: span 2; width: 24px; height: 24px; border-radius: 50%; background: var(--ink); color: #fff; display: grid; place-items: center; font: 600 12px var(--mono); } .olist span { color: var(--ink2); font-size: 14px; }

.badges { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
.pol .foot { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--rule); font-size: 13px; color: var(--dim); }
.form { display: grid; gap: 14px; }
.form label { display: grid; gap: 5px; font-weight: 600; font-size: 14px; }
.form select { border: 1px solid var(--rule2); border-radius: 5px; padding: 9px 10px; background: #fff; font-weight: 400; }
.form .rt { font-weight: 400; font-size: 12.5px; color: var(--dim); }
.form .grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.checks { display: flex; flex-wrap: wrap; gap: 8px 18px; font-size: 14px; } .checks label { display: flex; gap: 6px; align-items: center; font-weight: 400; }
.sim { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 18px; padding-bottom: 70px; }
footer { background: var(--night); color: #8E9BB2; font-size: 13.5px; padding: 26px 0 36px; }

@media (max-width: 1180px) {

}

  .strip .wrap { grid-template-columns: minmax(0, 1fr); }
  .pipe { grid-template-columns: repeat(2, minmax(0, 1fr)); }

const cache = {}, BUILT = {};
async function getCase(n) {
  if (BUILT[n]) return BUILT[n];
  if (!cache[n]) { const r = await fetch(`data/cases/${n}.json`); if (!r.ok) throw new Error("case not found"); cache[n] = await r.json(); }
  return cache[n];
}
function parseChart(c) {
  const order = new Date(c.request.order_date + "T00:00:00Z");
  return c.chart.map(line => { const m = line.match(/^\[([a-z]+)-(\d+)\]\s*(.*)$/); if (!m) return null;
    const date = (m[3].match(/\d{4}-\d{2}-\d{2}/) || [])[0];
    return { id: `${m[1]}-${m[2]}`, kind: m[1], date, days: date ? Math.round((order - new Date(date + "T00:00:00Z")) / 864e5) : null, line, text: m[3].replace(/^(started |onset )?\d{4}-\d{2}-\d{2}\s*/, "") }; }).filter(Boolean);
}
const daysText = d => d === null ? "" : d === 0 ? "order day" : d > 0 ? `${d} d before` : `${-d} d after`;
// Wrap the quoted text inside a record line with a highlighter mark. Falls back to the whole line.
function markQuote(html, text, quote, k, anim) {
  const cls = `q${anim ? " anim" : ""}" data-k="${k}`;
  const qs = esc(quote.replace(/^\d{4}-\d{2}-\d{2}\s*/, "").trim());
  if (qs && html.includes(qs)) return html.replace(qs, `<mark class="${cls}">${qs}</mark>`);
  return `<mark class="${cls}">${html}</mark>`;
}

function hist(el, vals, step, fmt) {

    ${bins.map((c, i) => { const h = (H - T - B) * c / max; return `<rect x="${L + i * bw + 1}" y="${H - B - h}" width="${Math.max(1, bw - 2)}" height="${h}" fill="#13203A"/>`; }).join("")}
    ${bins.map((_, i) => i % Math.ceil(nb / 6) === 0 ? `<text x="${L + i * bw + bw / 2}" y="${H - 8}" text-anchor="middle" font-size="11" fill="#6A7488" font-family="IBM Plex Mono">${fmt(lo + i * step)}</text>` : "").join("")}
    ${bins.map((_, i) => `<rect class="hh" data-i="${i}" x="${L + i * bw}" y="${T}" width="${bw}" height="${H - T - B}" fill="transparent"/>`).join("")}</svg>`;

}

      BUILT[c.case_id] = c; location.hash = `#/case/${c.case_id}`;
    } catch (err) { $("#b-note").textContent = "Could not create the patient: " + err.message; $("#b-make").disabled = false; }
  };
}

  <div class="pipe" style="margin:0 0 24px">${[["ai", "AI", "Read the request", "The fax becomes structured fields."], ["code", "CODE", "Pick the policy", "Matched by procedure code; the model only as a fallback."], ["mcp", "MCP", "Fetch the record", "FastMCP over a FHIR-like store. Every entry dated against the order."],
      ["ai", "AI × N", "Specialists", "LangGraph Send: one per rule, in parallel, each quoting the record.", true], ["code", "CODE", "Verify and decide", "Quotes must be in the record; numbers and dates must match; windows counted."],
      ["ai", "AI + TOOLS", "Investigator", "A ReAct agent with MCP search tools, only when a rule is undocumented."], ["ai", "AI", "Letter", "From verified findings only. Denials wait for a signature."]]
      .map(([c, t, h, p, par]) => `<div class="slip${par ? " par" : ""}"><span class="ty ${c}">${t}</span><h3>${h}</h3><p>${p}</p></div>`).join("")}</div>

  ${S ? `<section class="panel"><header><h2>What each design costs</h2></header><div class="tw"><table><thead><tr><th></th><th class="r">Model calls per request</th><th class="r">Cost per request</th><th class="r">Median time</th><th class="r">Correct</th></tr></thead><tbody>${SYS.map(s => `<tr${s === "authpilot" ? ' style="font-weight:600"' : ""}><td>${NAME[s]}</td><td class="r num">${S[s].model_calls_per_case}</td><td class="r num">$${S[s].cost_per_case.toFixed(3)}</td><td class="r num">${S[s].median_seconds.toFixed(1)}s</td><td class="r num">${pct(S[s].accuracy)}</td></tr>`).join("")}</tbody></table></div></section>` : ""}</div></div>`;
}
