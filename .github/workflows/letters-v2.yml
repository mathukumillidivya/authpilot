name: letters-v2
# Regenerate the held-out letters with version 2 (template + model reasons + gate) on the recorded findings,
# then score them with the same checks as the originals. The original letters and their scores are not touched.
on:
  workflow_dispatch:
    inputs:
      run_id: {default: "test-authpilot"}
      budget_letters: {default: "0.4"}
      budget_judge: {default: "0.6"}
      out: {description: "letters file to write", default: "letters_v21.jsonl"}
      reuse: {description: "reuse reason lines stored in this earlier letters file", default: "letters_v2.jsonl"}
      sample: {description: "judge this many letters at random (0 = all)", default: "80"}
permissions:
  contents: write
jobs:
  v2:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env: {ANTHROPIC_API_KEY: "${{ secrets.ANTHROPIC_API_KEY }}"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - run: python scripts/letters_v2.py "results/runs/${{ inputs.run_id }}" --budget "${{ inputs.budget_letters }}" --out "${{ inputs.out }}" ${{ inputs.reuse && format('--reuse {0}', inputs.reuse) || '' }}
      - run: python scripts/letter_check.py "results/runs/${{ inputs.run_id }}" --letters "${{ inputs.out }}" --judge --budget "${{ inputs.budget_judge }}" --sample "${{ inputs.sample }}"
      - name: Save
        if: always()
        run: |
          git config user.name "Divya Sri"
          git config user.email "hellosweety789@gmail.com"
          for f in results/runs/${{ inputs.run_id }}/letters_v2*.jsonl results/runs/${{ inputs.run_id }}/letter_check_v2*; do git add "$f"; done
          git commit -m "Letters v2: ${{ inputs.run_id }}" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase && git push && break; sleep $((RANDOM % 20 + 5)); done
